services:
  aeroagent-api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DEMO_AUTH: ${DEMO_AUTH:-true}
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
      DATABASE_URL: sqlite+aiosqlite:////app/var/aeroagent.db
      AIR_CONFIG_PATH: /app/var/config.json
      AIR_VAR_DIR: /app/var
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: aeroagent-api
    command: ["uv", "run", "--no-sync", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
