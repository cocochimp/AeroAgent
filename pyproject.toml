[project]
name = "air-ticket-agent"
version = "0.1.0"
description = "DDD 六边形架构机票退改签服务 Agent 学习项目"
requires-python = ">=3.13"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.28,<1",
  "fastembed>=0.7,<1",
  "qdrant-client>=1.14,<2",
  "rank-bm25>=0.2.2",
  "jieba>=0.42",
  "flashrank>=0.2,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=5,<7",
  "alembic>=1.14,<2",
  "pyjwt>=2.10,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: 需要下载/加载真实检索模型"]
addopts = "-m 'not slow'"
