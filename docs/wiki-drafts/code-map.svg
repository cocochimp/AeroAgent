<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#0F172A">代码地图：四层结构与其完成度</text>
  <text x="24" y="52" font-size="12.5" fill="#64748B">左边是目录，右边是说清它干什么用；颜色只表示完成度，不表示优先级</text>

  <rect x="24" y="80" width="404" height="252" rx="10" fill="#F8FAFC" stroke="#64748B"/>
  <text x="40" y="104" font-size="12" font-weight="600" fill="#334155">backend/app</text>
  <text x="56" y="128" font-size="11.5" fill="#475569">domain/</text>
  <text x="150" y="128" font-size="11" fill="#64748B">票、规则、服务、定价、财务、会员、履约七个上下文</text>
  <text x="56" y="150" font-size="11.5" fill="#475569">application/</text>
  <text x="150" y="150" font-size="11" fill="#64748B">用例、端口、三 Agent 门面、评测</text>
  <text x="56" y="172" font-size="11.5" fill="#475569">adapters/inbound/</text>
  <text x="150" y="172" font-size="11" fill="#64748B">HTTP 路由：cases、orders、admin、auth、health</text>
  <text x="56" y="194" font-size="11.5" fill="#475569">adapters/outbound/</text>
  <text x="150" y="194" font-size="11" fill="#64748B">postgres、redis、airline mock、legacy、telemetry</text>
  <text x="56" y="216" font-size="11.5" fill="#475569">api/main.py</text>
  <text x="150" y="216" font-size="11" fill="#64748B">挂 15 条 v1 路由</text>
  <text x="56" y="238" font-size="11.5" fill="#475569">air_agent/</text>
  <text x="150" y="238" font-size="11" fill="#64748B">旧版 LangGraph 图，编排尚未迁移</text>
  <text x="56" y="260" font-size="11.5" fill="#475569">worker.py</text>
  <text x="150" y="260" font-size="11" fill="#64748B">异步任务入口</text>
  <text x="56" y="282" font-size="11.5" fill="#475569">migrations/</text>
  <text x="150" y="282" font-size="11" fill="#64748B">0001_initial.py</text>
  <text x="40" y="312" font-size="11" fill="#94A3B8">仓库根还有 docs/、demo_data/、eval/、frontend/、infra/、scripts/、tests/</text>

  <rect x="452" y="80" width="404" height="118" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="468" y="104" font-size="12" font-weight="600" fill="#1D4ED8">已落地</text>
  <text x="468" y="128" font-size="11.5" fill="#1D4ED8">路由与鉴权、postgres 仓储、redis 事件、航司 mock、telemetry 追踪</text>
  <text x="468" y="148" font-size="11.5" fill="#1D4ED8">定价与复核、财务分录、会员等级模型、评测跑批</text>
  <text x="468" y="168" font-size="11.5" fill="#1D4ED8">能跑通主链路演示，也能被 trace 追到每一跳</text>
  <text x="468" y="186" font-size="11" fill="#3B82F6">面试里可以指着文件夹讲</text>

  <rect x="452" y="214" width="404" height="118" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="468" y="238" font-size="12" font-weight="600" fill="#334155">部分实现</text>
  <text x="468" y="262" font-size="11.5" fill="#475569">三 Agent 仍是门面类，run_turn 转发旧图</text>
  <text x="468" y="282" font-size="11.5" fill="#475569">domain/ticket 只有仓储端口，没有实体</text>
  <text x="468" y="302" font-size="11.5" fill="#475569">确认门禁缺令牌与快照比对；会员权益未接主链路</text>
  <text x="468" y="320" font-size="11" fill="#94A3B8">讲的时候要说清补什么</text>

  <rect x="452" y="348" width="404" height="118" rx="10" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="468" y="372" font-size="12" font-weight="600" fill="#7C2D12">未完成</text>
  <text x="468" y="396" font-size="11.5" fill="#7C2D12">application/orchestration 状态图未建</text>
  <text x="468" y="416" font-size="11.5" fill="#7C2D12">无 composition.py 统一装配根</text>
  <text x="468" y="436" font-size="11.5" fill="#7C2D12">无 qdrant 与 llm 出站适配器；无独立 outbox 包</text>
  <text x="468" y="454" font-size="11" fill="#9A3412">只能说方案，不能说实现</text>

  <rect x="24" y="352" width="404" height="114" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="40" y="376" font-size="12" font-weight="600" fill="#334155">怎么用这张图</text>
  <text x="40" y="400" font-size="11.5" fill="#475569">先按篇号找模块：01 领域、02 编排、03 工具、04 检索</text>
  <text x="40" y="420" font-size="11.5" fill="#475569">06 金额、07 评测、08 观测、11 交付</text>
  <text x="40" y="440" font-size="11.5" fill="#475569">再按右侧颜色决定能说「我做了」还是「我计划做」</text>

  <rect x="24" y="484" width="832" height="56" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-dasharray="5 3"/>
  <text x="38" y="508" font-size="11.5" fill="#334155">状态以仓库当前代码为准；与设计方案冲突时以代码为准，并把差异登记在本篇的变更记录</text>
  <text x="38" y="528" font-size="11" fill="#94A3B8">这张图是快照，重构推进会过时；每次大改后按同一套三档重新标一遍</text>
</svg>
