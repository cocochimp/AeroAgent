<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#0F172A">自进化闭环：从失败样本回到提示与规则</text>
  <text x="24" y="52" font-size="12.5" fill="#64748B">闭环的关键不是让模型自己改自己，而是让每一次失败都能落到一个可回滚的改动点上</text>

  <rect x="24" y="86" width="164" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="36" y="112" font-size="12" font-weight="600" fill="#334155">1. 失败采集</text>
  <text x="36" y="134" font-size="11.5" fill="#475569">客服复盘记录</text>
  <text x="36" y="152" font-size="11.5" fill="#475569">评测不过的用例</text>
  <text x="36" y="170" font-size="11" fill="#94A3B8">必须带案件与快照</text>

  <rect x="224" y="86" width="164" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="236" y="112" font-size="12" font-weight="600" fill="#334155">2. 归因分层</text>
  <text x="236" y="134" font-size="11.5" fill="#475569">理解 / 参数 / 检索</text>
  <text x="236" y="152" font-size="11.5" fill="#475569">金额 / 外部接口</text>
  <text x="236" y="170" font-size="11" fill="#94A3B8">分错层，改错地方</text>

  <rect x="424" y="86" width="164" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="436" y="112" font-size="12" font-weight="600" fill="#1D4ED8">3. 改动候选</text>
  <text x="436" y="134" font-size="11.5" fill="#1D4ED8">提示 / 工具契约</text>
  <text x="436" y="152" font-size="11.5" fill="#1D4ED8">规则数据 / 检索权重</text>
  <text x="436" y="170" font-size="11" fill="#1D4ED8">一次只动一个变量</text>

  <rect x="624" y="86" width="232" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="636" y="112" font-size="12" font-weight="600" fill="#7C2D12">4. 回归与放量</text>
  <text x="636" y="134" font-size="11.5" fill="#7C2D12">金标准集 + 高风险切片</text>
  <text x="636" y="152" font-size="11.5" fill="#7C2D12">不达标不上线</text>
  <text x="636" y="170" font-size="11" fill="#9A3412">这一步最容易被跳过</text>

  <path d="M190 129 L220 129" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a13)"/>
  <path d="M390 129 L420 129" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a13)"/>
  <path d="M590 129 L620 129" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a13)"/>
  <path d="M740 176 C740 240 106 240 106 176" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#b13)"/>
  <text x="404" y="262" font-size="11.5" fill="#1D4ED8">回边：下一轮从新失败里再挑一个改动点，不改模型权重</text>

  <rect x="24" y="290" width="404" height="86" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-dasharray="5 3"/>
  <text x="36" y="314" font-size="12" font-weight="600" fill="#334155">本项目状态：未落地</text>
  <text x="36" y="336" font-size="11.5" fill="#475569">有评测集与 bad case 归类，没有自动改动候选生成</text>
  <text x="36" y="356" font-size="11.5" fill="#475569">讲的时候只能讲方案，不能说已实现</text>

  <rect x="448" y="290" width="408" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="460" y="314" font-size="12" font-weight="600" fill="#334155">为什么不做全自动</text>
  <text x="460" y="336" font-size="11.5" fill="#475569">自动改提示会引入漂移，金额与规则场景不可回滚即不可用</text>
  <text x="460" y="356" font-size="11.5" fill="#475569">人在环上确认候选，才算可控的自进化</text>

  <rect x="24" y="398" width="832" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="36" y="422" font-size="12" font-weight="600" fill="#334155">判断一个改动值不值得做</text>
  <text x="36" y="444" font-size="11.5" fill="#475569">影响面（多少案件会走到）· 可验证性（有没有用例能证明变好）· 可回滚性（错了能不能十分钟退回）</text>
  <text x="36" y="462" font-size="11" fill="#94A3B8">三个里缺一个，就先别改</text>

  <defs>
    <marker id="a13" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/></marker>
    <marker id="b13" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
  </defs>
</svg>
