<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#0F172A">五项可讲的工作与它们的证据</text>
  <text x="24" y="52" font-size="12.5" fill="#64748B">一项工作对应一个可验证的落点；说不出文件或验证方式，这项就不算做过</text>

  <text x="30" y="86" font-size="12" font-weight="600" fill="#475569">工作</text>
  <text x="300" y="86" font-size="12" font-weight="600" fill="#475569">项目落点</text>
  <text x="600" y="86" font-size="12" font-weight="600" fill="#475569">一句话证据</text>

  <rect x="24" y="98" width="832" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="36" y="124" font-size="12" font-weight="600" fill="#334155">规划与编排</text>
  <text x="36" y="146" font-size="11" fill="#94A3B8">ReAct 何时该退化成状态机</text>
  <text x="300" y="124" font-size="11.5" fill="#334155">三 Agent 分工 + 中断恢复</text>
  <text x="300" y="146" font-size="11" fill="#64748B">主 Agent 不计算，交易 Agent 只执行</text>
  <text x="600" y="124" font-size="11.5" fill="#334155">能画出节点与中断点</text>
  <text x="600" y="146" font-size="11" fill="#64748B">说明确认后不重算金额</text>

  <rect x="24" y="176" width="832" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="36" y="202" font-size="12" font-weight="600" fill="#334155">意图理解</text>
  <text x="36" y="224" font-size="11" fill="#94A3B8">口语诉求怎么落成结构化条件</text>
  <text x="300" y="202" font-size="11.5" fill="#334155">场景 + 订单 + 时间三要素</text>
  <text x="300" y="224" font-size="11" fill="#64748B">歧义时先澄清再办理</text>
  <text x="600" y="202" font-size="11.5" fill="#334155">能说出漏识别的代价</text>
  <text x="600" y="224" font-size="11" fill="#64748B">错办一张票的赔付成本</text>

  <rect x="24" y="254" width="832" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="36" y="280" font-size="12" font-weight="600" fill="#334155">检索与依据</text>
  <text x="36" y="302" font-size="11" fill="#94A3B8">票规为什么不能只靠向量</text>
  <text x="300" y="280" font-size="11.5" fill="#334155">结构化过滤优先的五层漏斗</text>
  <text x="300" y="302" font-size="11" fill="#64748B">规则带版本与生效期</text>
  <text x="600" y="280" font-size="11.5" fill="#334155">能说出命中不了的兜底</text>
  <text x="600" y="302" font-size="11" fill="#64748B">转人工而不是硬答</text>

  <rect x="24" y="332" width="832" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="36" y="358" font-size="12" font-weight="600" fill="#334155">上下文与状态</text>
  <text x="36" y="380" font-size="11" fill="#94A3B8">长会话里什么该留、什么该丢</text>
  <text x="300" y="358" font-size="11.5" fill="#334155">订单栈 / 证据栈 / 记忆分层</text>
  <text x="300" y="380" font-size="11" fill="#64748B">checkpoint 存快照不存推理</text>
  <text x="600" y="358" font-size="11.5" fill="#334155">能说出压缩触发条件</text>
  <text x="600" y="380" font-size="11" fill="#64748B">证据过期怎么重取</text>

  <rect x="24" y="410" width="832" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="36" y="436" font-size="12" font-weight="600" fill="#7C2D12">金额与质量</text>
  <text x="36" y="458" font-size="11" fill="#9A3412">算错一次就是资损</text>
  <text x="300" y="436" font-size="11.5" fill="#7C2D12">1% 复核 + 报价快照 + 对账</text>
  <text x="300" y="458" font-size="11" fill="#9A3412">整数元与交叉相乘</text>
  <text x="600" y="436" font-size="11.5" fill="#7C2D12">能说出三条资金流</text>
  <text x="600" y="458" font-size="11" fill="#9A3412">航司应收 / 补贴 / 旅客实付</text>

  <text x="24" y="502" font-size="11" fill="#94A3B8">橙色一行是差异化所在：大多数候选人讲不清钱怎么流，能讲的直接进下一轮</text>
</svg>
