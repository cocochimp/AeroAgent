<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">两条校验失败的重试回路</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">参数回路在决策段拦工具入参，文案回路在生成段拦金额与论断；两条回路都有上限，超限转人工</text>

  <!-- 上半：参数回路 -->
  <text x="28" y="90" font-size="12.5" font-weight="600" fill="#1E40AF">工具参数回路 · 决策段</text>

  <rect x="36" y="104" width="158" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="115" y="128" font-size="12" fill="#1E3A8A" text-anchor="middle">agent_node 决策</text>
  <text x="115" y="146" font-size="10.5" fill="#64748B" text-anchor="middle">选工具、凑参数</text>

  <rect x="236" y="104" width="176" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="324" y="128" font-size="12" fill="#1E3A8A" text-anchor="middle">schema_validate</text>
  <text x="324" y="146" font-size="10.5" fill="#64748B" text-anchor="middle">tools.validate 字段级校验</text>

  <rect x="456" y="104" width="140" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="526" y="128" font-size="12" fill="#334155" text-anchor="middle">参数通过？</text>
  <text x="526" y="146" font-size="10.5" fill="#64748B" text-anchor="middle">未知工具名也算失败</text>

  <rect x="652" y="104" width="192" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="748" y="128" font-size="12" fill="#1E3A8A" text-anchor="middle">门禁 → 工具执行</text>
  <text x="748" y="146" font-size="10.5" fill="#64748B" text-anchor="middle">跳步检查后才放行</text>

  <path d="M194 133 L234 133" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#c1)"/>
  <path d="M412 133 L454 133" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#c1)"/>
  <path d="M596 133 L650 133" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#c1)"/>
  <text x="623" y="124" font-size="10.5" fill="#64748B" text-anchor="middle">通过</text>

  <rect x="236" y="186" width="280" height="62" rx="7" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="250" y="210" font-size="11.5" fill="#9A3412">字段级错误回灌 error_feedback</text>
  <text x="250" y="229" font-size="10.5" fill="#9A3412">field / kind / expected / got / message</text>
  <path d="M526 162 L526 184" fill="none" stroke="#EA580C" stroke-width="1.4" marker-end="url(#c2)"/>
  <text x="540" y="178" font-size="10.5" fill="#9A3412">不通过</text>
  <path d="M236 217 L115 217 L115 164" fill="none" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="170" y="210" font-size="10.5" fill="#9A3412" text-anchor="middle">退回重新决策</text>

  <rect x="652" y="186" width="192" height="62" rx="7" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="748" y="210" font-size="11.5" fill="#7C2D12" text-anchor="middle">超限转人工</text>
  <text x="748" y="229" font-size="10.5" fill="#9A3412" text-anchor="middle">max_tool_retries = 1</text>
  <path d="M596 150 L650 196" fill="none" stroke="#EA580C" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#c2)"/>

  <!-- 下半：文案回路 -->
  <text x="28" y="290" font-size="12.5" font-weight="600" fill="#1E40AF">方案文案回路 · 生成段</text>

  <rect x="36" y="304" width="176" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="124" y="328" font-size="12" fill="#1E3A8A" text-anchor="middle">tool_scheme_gen</text>
  <text x="124" y="346" font-size="10.5" fill="#64748B" text-anchor="middle">模板打底，LLM 只改措辞</text>

  <rect x="252" y="304" width="176" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="340" y="328" font-size="12" fill="#1E3A8A" text-anchor="middle">verify_node</text>
  <text x="340" y="346" font-size="10.5" fill="#64748B" text-anchor="middle">金额、论断、引用后验</text>

  <rect x="472" y="304" width="140" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="542" y="328" font-size="12" fill="#334155" text-anchor="middle">passed？</text>
  <text x="542" y="346" font-size="10.5" fill="#64748B" text-anchor="middle">置信度达阈值</text>

  <rect x="652" y="304" width="192" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="748" y="328" font-size="12" fill="#1E3A8A" text-anchor="middle">finish 答复</text>
  <text x="748" y="346" font-size="10.5" fill="#64748B" text-anchor="middle">可办理方案进确认中断</text>

  <path d="M212 333 L250 333" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#c1)"/>
  <path d="M428 333 L470 333" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#c1)"/>
  <path d="M612 333 L650 333" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#c1)"/>
  <text x="637" y="324" font-size="10.5" fill="#64748B" text-anchor="middle">通过</text>

  <rect x="252" y="386" width="280" height="62" rx="7" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="266" y="410" font-size="11.5" fill="#9A3412">retry_node：错误清单进 feedback</text>
  <text x="266" y="429" font-size="10.5" fill="#9A3412">金额不符、无依据论断、坏引用逐条列出</text>
  <path d="M542 362 L542 384" fill="none" stroke="#EA580C" stroke-width="1.4" marker-end="url(#c2)"/>
  <text x="556" y="378" font-size="10.5" fill="#9A3412">不通过</text>
  <path d="M252 417 L124 417 L124 364" fill="none" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#c2)"/>
  <text x="186" y="410" font-size="10.5" fill="#9A3412" text-anchor="middle">回灌再生成</text>

  <rect x="652" y="386" width="192" height="62" rx="7" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="748" y="410" font-size="11.5" fill="#7C2D12" text-anchor="middle">超限转人工</text>
  <text x="748" y="429" font-size="10.5" fill="#9A3412" text-anchor="middle">verify.max_retries = 1</text>
  <path d="M612 360 L650 396" fill="none" stroke="#EA580C" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#c2)"/>

  <rect x="28" y="472" width="816" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="493" font-size="11.5" fill="#475569">重试只修正可修复的偏差：参数错了带字段重填，文案错了带清单重写；金额来源和权限边界问题重试修不好，必须在门禁与结构上解决</text>

  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="c2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EA580C"/></marker>
  </defs>
</svg>
