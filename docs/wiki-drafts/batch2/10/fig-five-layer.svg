<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">五层提示的分工与校验点</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">每一层提示写在哪、由哪段代码兜底；只有提示、没有校验点的层按裸提示记</text>

  <!-- 行 1 身份层 -->
  <rect x="28" y="82" width="170" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="113" y="112" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">身份层</text>
  <text x="113" y="132" font-size="10.5" fill="#475569" text-anchor="middle">你是谁、权限边界</text>
  <rect x="210" y="82" width="330" height="74" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="224" y="108" font-size="11.5" fill="#334155">memory.py：SYSTEM_PROMPT</text>
  <text x="224" y="128" font-size="11" fill="#64748B">角色定位；只能依据规则和引擎金额作答</text>
  <text x="224" y="146" font-size="11" fill="#64748B">拿不准时说明需要转人工</text>
  <rect x="556" y="82" width="292" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="570" y="108" font-size="11.5" fill="#334155">兜底：三 Agent 工具白名单</text>
  <text x="570" y="128" font-size="11" fill="#64748B">主 Agent 无写工具；提示只做角色说明</text>
  <text x="570" y="146" font-size="11" fill="#64748B">权限边界以代码侧 can_call 为准</text>
  <path d="M198 119 L208 119" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>
  <path d="M540 119 L554 119" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>

  <!-- 行 2 任务层 -->
  <rect x="28" y="166" width="170" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="113" y="196" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">任务层</text>
  <text x="113" y="216" font-size="10.5" fill="#475569" text-anchor="middle">本轮要做什么</text>
  <rect x="210" y="166" width="330" height="74" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="224" y="192" font-size="11.5" fill="#334155">planner.py：llm_messages 用户段</text>
  <text x="224" y="212" font-size="11" fill="#64748B">当前子诉求、订单画像、会话历史、工具观察</text>
  <text x="224" y="230" font-size="11" fill="#64748B">上次参数错误；先思考再调一个工具</text>
  <rect x="556" y="166" width="292" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="570" y="192" font-size="11.5" fill="#334155">兜底：计划表与条件边路由</text>
  <text x="570" y="212" font-size="11" fill="#64748B">PLANS 规定每类意图的工具顺序</text>
  <text x="570" y="230" font-size="11" fill="#64748B">下一步是否合法由路由判断，不靠模型回忆</text>
  <path d="M198 203 L208 203" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>
  <path d="M540 203 L554 203" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>

  <!-- 行 3 约束层 -->
  <rect x="28" y="250" width="170" height="74" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="113" y="280" font-size="13" font-weight="600" fill="#7C2D12" text-anchor="middle">约束层</text>
  <text x="113" y="300" font-size="10.5" fill="#9A3412" text-anchor="middle">不许做什么</text>
  <rect x="210" y="250" width="330" height="74" rx="8" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="224" y="276" font-size="11.5" fill="#334155">SYSTEM_PROMPT、planner 用户段、write_scheme</text>
  <text x="224" y="296" font-size="11" fill="#64748B">不自算金额；不新增规则外承诺；算钱前先检索</text>
  <text x="224" y="314" font-size="11" fill="#64748B">日期必须是 YYYY-MM-DD 绝对日期</text>
  <rect x="556" y="250" width="292" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="570" y="276" font-size="11.5" fill="#334155">兜底：跳步门禁 + 后验校验 + 白名单</text>
  <text x="570" y="296" font-size="11" fill="#64748B">checkpoint_gate 拦住未检索就算钱</text>
  <text x="570" y="314" font-size="11" fill="#64748B">verify 核金额与论断；提示只是第一层</text>
  <path d="M198 287 L208 287" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>
  <path d="M540 287 L554 287" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>

  <!-- 行 4 输出 schema 层 -->
  <rect x="28" y="334" width="170" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="113" y="364" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">输出 schema 层</text>
  <text x="113" y="384" font-size="10.5" fill="#475569" text-anchor="middle">返回什么结构</text>
  <rect x="210" y="334" width="330" height="74" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="224" y="360" font-size="11.5" fill="#334155">tools.py：SCHEMAS 导出 function 定义</text>
  <text x="224" y="380" font-size="11" fill="#64748B">JSON 类输出在提示里写明字段形状与枚举</text>
  <text x="224" y="398" font-size="11" fill="#64748B">工具参数模型即 schema 单一来源</text>
  <rect x="556" y="334" width="292" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="570" y="360" font-size="11.5" fill="#334155">兜底：tools.validate 字段级校验</text>
  <text x="570" y="380" font-size="11" fill="#64748B">错误带字段、类型、期望值、收到值</text>
  <text x="570" y="398" font-size="11" fill="#64748B">未知工具名单独报 UNKNOWN_TOOL</text>
  <path d="M198 371 L208 371" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>
  <path d="M540 371 L554 371" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>

  <!-- 行 5 证据引用层 -->
  <rect x="28" y="418" width="170" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="113" y="448" font-size="13" font-weight="600" fill="#1E3A8A" text-anchor="middle">证据引用层</text>
  <text x="113" y="468" font-size="10.5" fill="#475569" text-anchor="middle">挂哪条依据</text>
  <rect x="210" y="418" width="330" height="74" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="224" y="444" font-size="11.5" fill="#334155">方案选项挂 rule_refs；金额来自引擎结果</text>
  <text x="224" y="464" font-size="11" fill="#64748B">权益类论断必须能对上被引用规则原文</text>
  <text x="224" y="482" font-size="11" fill="#64748B">引用规则必须在本次检索结果之内</text>
  <rect x="556" y="418" width="292" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="570" y="444" font-size="11.5" fill="#334155">兜底：verify.check 逐条核对</text>
  <text x="570" y="464" font-size="11" fill="#64748B">金额逐项比对；论断短语核查；bad refs 报错</text>
  <text x="570" y="482" font-size="11" fill="#64748B">任一不通过，置信度清零并进重试回路</text>
  <path d="M198 455 L208 455" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>
  <path d="M540 455 L554 455" fill="none" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#b1)"/>

  <rect x="28" y="510" width="820" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="531" font-size="11.5" fill="#475569">评审顺序：先看每层有没有代码侧校验点，再看提示写得全不全；约束层橙色标出，是因为它最容易被误以为「写进提示就守住了」</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
