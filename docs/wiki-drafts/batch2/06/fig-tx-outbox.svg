<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">事务边界与 Outbox 外发</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">本地记录先在事务内落库，消息再由 Worker 取出投递；外部通道不在业务事务内被直接调用</text>

  <rect x="28" y="82" width="380" height="330" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="48" y="110" font-size="12.5" font-weight="600" fill="#1E40AF">确认事务 · PostgreSQL 同一事务边界</text>

  <rect x="48" y="128" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="64" y="151" font-size="12" font-weight="600" fill="#1E3A8A">Operation 操作记录</text>
  <text x="64" y="170" font-size="10.5" fill="#64748B">幂等键唯一，绑定报价标识、动作与旅客应付金额</text>

  <rect x="48" y="196" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="64" y="219" font-size="12" font-weight="600" fill="#1E3A8A">Outbox 外发记录</text>
  <text x="64" y="238" font-size="10.5" fill="#64748B">topic 与操作标识落库，发布时间留空，待 Worker 派发</text>

  <rect x="48" y="264" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="64" y="287" font-size="12" font-weight="600" fill="#1E3A8A">Audit 审计记录</text>
  <text x="64" y="306" font-size="10.5" fill="#64748B">确认金额、复核金额、平台差额与操作标识留痕</text>

  <rect x="48" y="336" width="340" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="218" y="364" font-size="11.5" fill="#1E3A8A" text-anchor="middle">三者一起提交；任一失败整体回滚，不留半成品</text>

  <path d="M408 124 L468 124" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#t1)"/>

  <rect x="472" y="100" width="380" height="48" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="492" y="129" font-size="12" fill="#1E3A8A">Worker 轮询未发布的 Outbox 记录</text>

  <path d="M662 148 L662 176" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#t1)"/>

  <rect x="472" y="180" width="380" height="48" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="492" y="209" font-size="12" fill="#1E3A8A">投递 Redis Streams，消费组确认后重试与死信</text>

  <path d="M662 228 L662 256" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#t2)"/>

  <rect x="472" y="260" width="380" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="492" y="289" font-size="12" fill="#7C2D12">航司 mock 办理：外部调用，按幂等键去重</text>

  <path d="M662 308 L662 336" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#t2)"/>

  <rect x="472" y="340" width="380" height="56" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="492" y="363" font-size="12" font-weight="600" fill="#1E3A8A">回执后第二事务补记账本</text>
  <text x="492" y="382" font-size="10.5" fill="#64748B">旅客、航司、平台三分录，操作置成功，案件完成</text>

  <rect x="28" y="452" width="824" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="472" font-size="11.5" fill="#475569">重复安全两层兜底：数据库唯一约束挡重复幂等键，航司侧按键去重；回执金额不一致进对账待核，不改写报价</text>

  <defs>
    <marker id="t1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="t2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EA580C"/></marker>
  </defs>
</svg>
