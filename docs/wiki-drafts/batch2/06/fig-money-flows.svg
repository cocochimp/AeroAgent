<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">三条资金流与 1% 复核边界</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">航司应收、平台承担、旅客实付各记各的；涨价落在 1% 内按确认价办理，超出才重新报价</text>

  <rect x="28" y="82" width="380" height="388" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="48" y="110" font-size="12.5" font-weight="600" fill="#475569">分账示例 · 一次改签（教学口径）</text>

  <rect x="48" y="128" width="340" height="46" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="218" y="148" font-size="12" fill="#1E3A8A" text-anchor="middle">航司应收合计 500 元</text>
  <text x="218" y="165" font-size="11" fill="#475569" text-anchor="middle">改签费 300 元 ＋ 票面差价 200 元</text>

  <rect x="48" y="192" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="64" y="214" font-size="12.5" font-weight="600" fill="#1E3A8A">AIRLINE 航司应收</text>
  <text x="372" y="214" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="end">500 元</text>
  <text x="64" y="233" font-size="10.5" fill="#64748B">按航司账单结算，不被平台抵扣冲减</text>

  <rect x="48" y="256" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="64" y="278" font-size="12.5" font-weight="600" fill="#1E3A8A">PLATFORM 平台承担</text>
  <text x="372" y="278" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="end">100 元</text>
  <text x="64" y="297" font-size="10.5" fill="#64748B">会员权益抵扣；1% 价格保护差额也记此账户</text>

  <rect x="48" y="320" width="340" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="64" y="342" font-size="12.5" font-weight="600" fill="#1E40AF">CUSTOMER 旅客实付</text>
  <text x="372" y="342" font-size="12.5" font-weight="600" fill="#1E40AF" text-anchor="end">400 元</text>
  <text x="64" y="361" font-size="10.5" fill="#64748B">500 元航司费用 － 100 元平台抵扣</text>

  <text x="48" y="398" font-size="11" fill="#475569">· 三笔分录各自绑定同一 operation 与报价明细</text>
  <text x="48" y="420" font-size="11" fill="#475569">· 平台补贴只减少旅客应付，不改写航司应收</text>
  <text x="48" y="442" font-size="11" fill="#475569">· 会员权益抵扣当前未接入报价，属目标口径</text>
  <text x="48" y="464" font-size="11" fill="#475569">· 价格保护差额是平台承担，不是给旅客降价</text>

  <rect x="472" y="82" width="380" height="388" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="492" y="110" font-size="12.5" font-weight="600" fill="#1E40AF">确认后复核 · 1% 价格保护带（确认价 Q＝1000）</text>

  <rect x="492" y="128" width="340" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="662" y="154" font-size="11.5" fill="#334155" text-anchor="middle">判定：当前价 × 100 小于等于 确认价 × 101，含边界</text>

  <rect x="492" y="184" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="508" y="206" font-size="12" font-weight="600" fill="#1E3A8A">R 不大于 1000（降价或持平）</text>
  <text x="508" y="225" font-size="10.5" fill="#64748B">按确认价 1000 办理；降价差额不自动让利旅客</text>

  <rect x="492" y="248" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="508" y="270" font-size="12" font-weight="600" fill="#1E3A8A">1000 小于 R 不大于 1010</text>
  <text x="508" y="289" font-size="10.5" fill="#64748B">按确认价 1000 办理，超出部分记平台价格保护</text>

  <rect x="492" y="312" width="340" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="508" y="334" font-size="12" font-weight="600" fill="#7C2D12">R 不小于 1011（涨幅超 1%）</text>
  <text x="508" y="353" font-size="10.5" fill="#9A3412">生成新报价，展示明细与有效期，必须再次确认</text>

  <rect x="492" y="378" width="340" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="508" y="400" font-size="10.5" fill="#475569">边界验算：1010 × 100 ＝ 101000</text>
  <text x="508" y="418" font-size="10.5" fill="#475569">1000 × 101 ＝ 101000，相等，仍按确认价办理</text>

  <text x="492" y="460" font-size="11" fill="#1E40AF">· 比较的是旅客最终应付金额，不比较裸票价或单项手续费</text>

  <rect x="28" y="486" width="824" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="506" font-size="11.5" fill="#475569">平台承担不冲减航司应收；确认快照不被当次重算覆盖；退款金额下降必须重新确认</text>
</svg>
