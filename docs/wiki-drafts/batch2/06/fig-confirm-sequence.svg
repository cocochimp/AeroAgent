<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">确认到办理的真实时序</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">本地记录先落库提交，再由 Worker 提交航司；回执回来后补记账本，重复提交由幂等键兜底</text>

  <rect x="30" y="82" width="120" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="90" y="107" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">旅客浏览器</text>
  <rect x="170" y="82" width="120" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="230" y="107" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">API 路由</text>
  <rect x="310" y="82" width="120" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="370" y="107" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">业务服务</text>
  <rect x="450" y="82" width="120" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="510" y="107" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">PostgreSQL</text>
  <rect x="590" y="82" width="120" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="650" y="107" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">Worker</text>
  <rect x="730" y="82" width="120" height="40" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="790" y="107" font-size="11.5" font-weight="600" fill="#7C2D12" text-anchor="middle">航司 mock</text>

  <line x1="90" y1="122" x2="90" y2="470" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="230" y1="122" x2="230" y2="470" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="370" y1="122" x2="370" y2="470" stroke="#93C5FD" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="510" y1="122" x2="510" y2="470" stroke="#93C5FD" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="650" y1="122" x2="650" y2="470" stroke="#93C5FD" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="790" y1="122" x2="790" y2="470" stroke="#FED7AA" stroke-width="1" stroke-dasharray="4 3"/>

  <path d="M90 150 L226 150" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="160" y="143" font-size="10.5" fill="#334155" text-anchor="middle">确认报价请求：确认标识、幂等键</text>

  <path d="M230 188 L366 188" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="298" y="181" font-size="10.5" fill="#334155" text-anchor="middle">调用确认用例</text>

  <path d="M370 226 L506 226" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="438" y="219" font-size="10.5" fill="#334155" text-anchor="middle">行锁取报价，校验归属，重算当前价并跑复核带</text>

  <path d="M370 264 L506 264" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="438" y="257" font-size="10.5" fill="#334155" text-anchor="middle">同事务写操作、Outbox、审计并提交</text>

  <path d="M650 302 L514 302" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="582" y="295" font-size="10.5" fill="#334155" text-anchor="middle">拉取未发布记录，投递 Streams</text>

  <path d="M650 340 L786 340" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#s2)"/>
  <text x="718" y="333" font-size="10.5" fill="#9A3412" text-anchor="middle">提交办理命令（带幂等键）</text>

  <path d="M790 378 L654 378" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#s2)"/>
  <text x="722" y="371" font-size="10.5" fill="#9A3412" text-anchor="middle">回执：受理状态与供应商参考号</text>

  <path d="M650 416 L514 416" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="582" y="409" font-size="10.5" fill="#334155" text-anchor="middle">回写操作状态，补记账本分录，案件完成</text>

  <rect x="28" y="486" width="824" height="28" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="505" font-size="11.5" fill="#475569">超出保护带不提交航司：报价置为待重新报价，案件回到等待确认；办理失败或结果未知先查单，不盲目二次提交</text>

  <defs>
    <marker id="s1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="s2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EA580C"/></marker>
  </defs>
</svg>
