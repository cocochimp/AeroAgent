<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="540" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">读写分离命名：从工具名就能看出它会不会动钱</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">前缀即权限：read_ 只读、quote_ 计算报价、commit_ 写库或调外部</text>

  <!-- Target naming column -->
  <rect x="28" y="88" width="380" height="400" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="48" y="116" font-size="13" font-weight="600" fill="#1E40AF">目标命名规范</text>

  <rect x="48" y="132" width="120" height="36" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="108" y="155" font-size="11" fill="#1E3A8A" text-anchor="middle">read_*</text>
  <text x="180" y="155" font-size="11" fill="#64748B">只读查询，可并行，不产生副作用</text>

  <rect x="48" y="180" width="120" height="36" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="108" y="203" font-size="11" fill="#1E3A8A" text-anchor="middle">read_flight</text>
  <text x="180" y="203" font-size="11" fill="#64748B">查航班实时状态</text>

  <rect x="48" y="220" width="120" height="36" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="108" y="243" font-size="11" fill="#1E3A8A" text-anchor="middle">read_rule</text>
  <text x="180" y="243" font-size="11" fill="#64748B">检索退改规则</text>

  <rect x="48" y="276" width="120" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="108" y="299" font-size="11" fill="#334155" text-anchor="middle">quote_*</text>
  <text x="180" y="299" font-size="11" fill="#64748B">计算金额，不写库，不调外部</text>

  <rect x="48" y="316" width="120" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="108" y="339" font-size="11" fill="#334155" text-anchor="middle">quote_fee</text>
  <text x="180" y="339" font-size="11" fill="#64748B">核价：退改签费用明细</text>

  <rect x="48" y="372" width="120" height="36" rx="7" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="108" y="395" font-size="11" fill="#7C2D12" text-anchor="middle">commit_*</text>
  <text x="180" y="395" font-size="11" fill="#9A3412">写库或调外部，必须有确认令牌</text>

  <rect x="48" y="412" width="120" height="36" rx="7" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="108" y="435" font-size="11" fill="#7C2D12" text-anchor="middle">commit_ticket</text>
  <text x="180" y="435" font-size="11" fill="#9A3412">办理改签/退票，仅交易 Agent 可调</text>

  <!-- Legacy naming column -->
  <rect x="472" y="88" width="380" height="400" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="492" y="116" font-size="13" font-weight="600" fill="#475569">本项目现状（legacy 命名）</text>

  <rect x="492" y="140" width="160" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="572" y="163" font-size="11" fill="#334155" text-anchor="middle">tool_flight_status</text>
  <text x="664" y="163" font-size="10.5" fill="#94A3B8">对应 read_flight</text>

  <rect x="492" y="188" width="160" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="572" y="211" font-size="11" fill="#334155" text-anchor="middle">tool_rule_retrieve</text>
  <text x="664" y="211" font-size="10.5" fill="#94A3B8">对应 read_rule</text>

  <rect x="492" y="236" width="160" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="572" y="259" font-size="11" fill="#334155" text-anchor="middle">tool_recalc_fee</text>
  <text x="664" y="259" font-size="10.5" fill="#94A3B8">对应 quote_fee</text>

  <rect x="492" y="284" width="160" height="36" rx="7" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="572" y="307" font-size="11" fill="#7C2D12" text-anchor="middle">tool_issue_ticket</text>
  <text x="664" y="307" font-size="10.5" fill="#9A3412">对应 commit_ticket</text>

  <text x="492" y="350" font-size="11.5" fill="#64748B">问题：</text>
  <text x="492" y="372" font-size="11" fill="#64748B">· tool_ 前缀不区分读写权限</text>
  <text x="492" y="392" font-size="11" fill="#64748B">· tool_issue_ticket 在 SCHEMAS 里</text>
  <text x="492" y="410" font-size="11" fill="#64748B">  但不在 REACT_TOOLS 白名单里</text>
  <text x="492" y="430" font-size="11" fill="#64748B">· 写操作靠 REACT_TOOLS 列表排除，</text>
  <text x="492" y="448" font-size="11" fill="#64748B">  而不是靠命名约定</text>

  <rect x="28" y="504" width="824" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="524" font-size="11.5" fill="#475569">命名前缀不是装饰：评审一个工具列表时，扫一眼前缀就知道哪些可以随便调、哪些必须门禁</text>
</svg>
