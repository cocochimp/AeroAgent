<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">工具即契约：Schema 是模型与系统之间唯一的接口</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">模型只看见 Schema 描述的参数；系统只接受经过 Schema 校验的输入</text>

  <!-- Left: Model side -->
  <rect x="28" y="88" width="240" height="360" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="48" y="116" font-size="12.5" font-weight="600" fill="#1E40AF">模型侧（LLM）</text>
  <text x="48" y="136" font-size="11" fill="#475569">看见的只是函数签名</text>

  <rect x="52" y="152" width="192" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="148" y="174" font-size="11.5" fill="#1E3A8A" text-anchor="middle">tool_rule_retrieve</text>
  <text x="148" y="191" font-size="10" fill="#64748B" text-anchor="middle">query, airline?, cabin?, scenario?</text>

  <rect x="52" y="216" width="192" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="148" y="238" font-size="11.5" fill="#1E3A8A" text-anchor="middle">tool_recalc_fee</text>
  <text x="148" y="255" font-size="10" fill="#64748B" text-anchor="middle">order_id, action, target_date?</text>

  <rect x="52" y="280" width="192" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="148" y="302" font-size="11.5" fill="#7C2D12" text-anchor="middle">tool_issue_ticket</text>
  <text x="148" y="319" font-size="10" fill="#9A3412" text-anchor="middle">不在 ReAct 白名单内</text>

  <text x="48" y="368" font-size="11" fill="#64748B">· 工具数量 = 模型每次选择的候选</text>
  <text x="48" y="388" font-size="11" fill="#64748B">· 参数越精确，幻觉越少</text>
  <text x="48" y="408" font-size="11" fill="#64748B">· 写工具不暴露给 ReAct 循环</text>

  <!-- Middle: Contract boundary -->
  <rect x="310" y="140" width="260" height="200" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="440" y="168" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Schema 校验层</text>
  <text x="440" y="188" font-size="11" fill="#64748B" text-anchor="middle">tools.validate() + Pydantic</text>

  <rect x="332" y="204" width="216" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="440" y="227" font-size="11" fill="#334155" text-anchor="middle">类型校验 + 正则 + 交叉字段</text>

  <rect x="332" y="248" width="216" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="440" y="271" font-size="11" fill="#334155" text-anchor="middle">错误结构：field / kind / expected</text>

  <rect x="332" y="292" width="216" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="440" y="315" font-size="11" fill="#334155" text-anchor="middle">通过 → 清洗后参数；失败 → 回灌</text>

  <!-- Right: System side -->
  <rect x="612" y="88" width="240" height="360" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="632" y="116" font-size="12.5" font-weight="600" fill="#475569">系统侧（确定性服务）</text>
  <text x="632" y="136" font-size="11" fill="#475569">只接受校验通过的参数</text>

  <rect x="636" y="152" width="192" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="732" y="178" font-size="11.5" fill="#334155" text-anchor="middle">retrieval.search()</text>

  <rect x="636" y="208" width="192" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="732" y="234" font-size="11.5" fill="#334155" text-anchor="middle">engine.calc()</text>

  <rect x="636" y="264" width="192" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="732" y="290" font-size="11.5" fill="#334155" text-anchor="middle">data.get_flight()</text>

  <rect x="636" y="320" width="192" height="44" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="732" y="346" font-size="11.5" fill="#7C2D12" text-anchor="middle">issue_ticket()</text>
  <text x="732" y="360" font-size="10" fill="#9A3412" text-anchor="middle">仅由确认流程调用</text>

  <!-- Arrows -->
  <path d="M270 220 L308 220" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#b1)"/>
  <path d="M570 220 L610 220" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#b1)"/>
  <path d="M310 320 C280 340 280 360 270 370" fill="none" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#b2)"/>
  <text x="262" y="350" font-size="10" fill="#EA580C" text-anchor="end">错误回灌</text>

  <!-- Bottom bar -->
  <rect x="28" y="472" width="824" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="495" font-size="11.5" fill="#475569">Schema 不是文档，而是运行时拦截器：模型输出不合规时，错误被结构化地回灌给模型，而不是让系统崩溃或返回模糊的失败</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EA580C"/></marker>
  </defs>
</svg>
