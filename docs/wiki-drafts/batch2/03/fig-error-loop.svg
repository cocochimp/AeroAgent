<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">结构化错误回灌：三种失败，三种接法</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">模型不是一次就对，错误必须告诉它错在哪、期望什么，而不是笼统地说「出错了」</text>

  <!-- Three error types as columns -->
  <!-- Column 1: Unknown tool -->
  <rect x="28" y="88" width="260" height="340" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="48" y="116" font-size="12.5" font-weight="600" fill="#475569">类型一：未知工具名</text>
  <rect x="48" y="132" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="158" y="155" font-size="10.5" fill="#64748B" text-anchor="middle">kind = UNKNOWN_TOOL</text>

  <text x="48" y="190" font-size="11" fill="#334155"><tspan font-weight="600">触发：</tspan>模型调了不在</text>
  <text x="48" y="208" font-size="11" fill="#334155">SCHEMAS 里的工具名</text>

  <text x="48" y="240" font-size="11" fill="#334155"><tspan font-weight="600">回灌内容：</tspan></text>
  <text x="48" y="258" font-size="10.5" fill="#64748B">· expected：可用工具列表</text>
  <text x="48" y="276" font-size="10.5" fill="#64748B">· got：模型实际调的名字</text>

  <text x="48" y="308" font-size="11" fill="#334155"><tspan font-weight="600">接节点：</tspan></text>
  <text x="48" y="326" font-size="10.5" fill="#64748B">schema_validate → agent_node</text>
  <text x="48" y="344" font-size="10.5" fill="#64748B">（重试，超过上限转人工）</text>

  <text x="48" y="380" font-size="11" fill="#EA580C"><tspan font-weight="600">本项目代码：</tspan></text>
  <text x="48" y="398" font-size="10" fill="#94A3B8">tools.py: _unknown_tool_error()</text>

  <!-- Column 2: Schema validation -->
  <rect x="310" y="88" width="260" height="340" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="330" y="116" font-size="12.5" font-weight="600" fill="#475569">类型二：参数不合 Schema</text>
  <rect x="330" y="132" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="440" y="155" font-size="10.5" fill="#64748B" text-anchor="middle">kind = MISSING / TYPE / ENUM</text>

  <text x="330" y="190" font-size="11" fill="#334155"><tspan font-weight="600">触发：</tspan>字段缺失、类型错、</text>
  <text x="330" y="208" font-size="11" fill="#334155">正则不匹配、枚举值不对</text>

  <text x="330" y="240" font-size="11" fill="#334155"><tspan font-weight="600">回灌内容：</tspan></text>
  <text x="330" y="258" font-size="10.5" fill="#64748B">· field：出错的字段名</text>
  <text x="330" y="276" font-size="10.5" fill="#64748B">· expected：期望格式/取值</text>
  <text x="330" y="294" font-size="10.5" fill="#64748B">· message：人话描述</text>

  <text x="330" y="326" font-size="11" fill="#334155"><tspan font-weight="600">接节点：</tspan></text>
  <text x="330" y="344" font-size="10.5" fill="#64748B">schema_validate → agent_node</text>
  <text x="330" y="362" font-size="10.5" fill="#64748B">（模型根据反馈重新填参数）</text>

  <text x="330" y="398" font-size="11" fill="#EA580C"><tspan font-weight="600">本项目代码：</tspan></text>
  <text x="330" y="416" font-size="10" fill="#94A3B8">tools.py: validate() + _kind()</text>

  <!-- Column 3: Gate block -->
  <rect x="592" y="88" width="260" height="340" rx="10" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="612" y="116" font-size="12.5" font-weight="600" fill="#7C2D12">类型三：前置证据缺失</text>
  <rect x="612" y="132" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="722" y="155" font-size="10.5" fill="#9A3412" text-anchor="middle">kind = SKIP_RULE</text>

  <text x="612" y="190" font-size="11" fill="#334155"><tspan font-weight="600">触发：</tspan>还没查规则就想算费</text>
  <text x="612" y="208" font-size="11" fill="#334155">（checkpoint_gate 拦截）</text>

  <text x="612" y="240" font-size="11" fill="#334155"><tspan font-weight="600">回灌内容：</tspan></text>
  <text x="612" y="258" font-size="10.5" fill="#64748B">· plan：需要先完成的步骤</text>
  <text x="612" y="276" font-size="10.5" fill="#64748B">· message：为什么被拦截</text>

  <text x="612" y="308" font-size="11" fill="#334155"><tspan font-weight="600">接节点：</tspan></text>
  <text x="612" y="326" font-size="10.5" fill="#64748B">checkpoint_gate → agent_node</text>
  <text x="612" y="344" font-size="10.5" fill="#64748B">（超过 2 次转人工）</text>

  <text x="612" y="380" font-size="11" fill="#EA580C"><tspan font-weight="600">本项目代码：</tspan></text>
  <text x="612" y="398" font-size="10" fill="#9A3412">graph.py: checkpoint_gate()</text>

  <rect x="28" y="448" width="824" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="471" font-size="11.5" fill="#475569">三种错误走同一个回环：错误写进 error_feedback，模型下一轮看到它并修正；区别在于谁判定、谁接、重试几次</text>
</svg>
