<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">确认命令模式：交易侧只接受绑定报价的命令</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">quote_id + action + amount + idempotency_key 四元组绑定，模型不能直接构造写命令</text>

  <!-- Top: Quote offered -->
  <rect x="280" y="88" width="320" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="440" y="112" font-size="12.5" font-weight="600" fill="#1E40AF" text-anchor="middle">报价生成（QuoteRecord）</text>
  <text x="440" y="132" font-size="11" fill="#475569" text-anchor="middle">quote_id=q_xxx · action=CHANGE · amount=4500 · status=OFFERED</text>

  <path d="M440 148 L440 180" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#c1)"/>

  <!-- Middle: User confirm -->
  <rect x="280" y="184" width="320" height="60" rx="10" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="440" y="208" font-size="12.5" font-weight="600" fill="#7C2D12" text-anchor="middle">用户点击确认（HTTP POST）</text>
  <text x="440" y="228" font-size="11" fill="#9A3412" text-anchor="middle">POST /api/v1/quotes/{quote_id}/confirm</text>

  <path d="M440 244 L440 276" fill="none" stroke="#EA580C" stroke-width="1.6" marker-end="url(#c2)"/>

  <!-- Bottom: Command constructed server-side -->
  <rect x="120" y="280" width="640" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="440" y="306" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">服务端构造确认命令（create_confirmed_operation）</text>

  <rect x="148" y="320" width="130" height="56" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="213" y="342" font-size="10.5" fill="#1E3A8A" text-anchor="middle">quote_id</text>
  <text x="213" y="358" font-size="10" fill="#64748B" text-anchor="middle">从报价记录读</text>

  <rect x="296" y="320" width="130" height="56" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="361" y="342" font-size="10.5" fill="#1E3A8A" text-anchor="middle">action</text>
  <text x="361" y="358" font-size="10" fill="#64748B" text-anchor="middle">从报价记录读</text>

  <rect x="444" y="320" width="130" height="56" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="509" y="342" font-size="10.5" fill="#1E3A8A" text-anchor="middle">amount</text>
  <text x="509" y="358" font-size="10" fill="#64748B" text-anchor="middle">复核后写入</text>

  <rect x="592" y="320" width="140" height="56" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="662" y="342" font-size="10.5" fill="#7C2D12" text-anchor="middle">idempotency_key</text>
  <text x="662" y="358" font-size="10" fill="#9A3412" text-anchor="middle">客户端传入</text>

  <path d="M440 400 L440 430" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#c1)"/>

  <!-- Final: Operation -->
  <rect x="240" y="434" width="400" height="56" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="440" y="458" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="middle">OperationRecord（PENDING → SUBMITTED → SUCCEEDED）</text>
  <text x="440" y="476" font-size="10.5" fill="#475569" text-anchor="middle">同一 idempotency_key 重复请求直接返回，不产生第二次外部动作</text>

  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="c2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EA580C"/></marker>
  </defs>
</svg>
