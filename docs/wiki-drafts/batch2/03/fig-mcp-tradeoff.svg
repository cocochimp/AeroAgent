<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">MCP 解决什么、不解决什么</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">MCP 是工具发现协议，不是权限框架；它让模型更容易接到外部服务器，但不告诉你「谁能写」</text>

  <!-- MCP side -->
  <rect x="28" y="88" width="400" height="300" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="48" y="116" font-size="13" font-weight="600" fill="#1E40AF">MCP 能解决的</text>

  <rect x="48" y="132" width="360" height="40" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="228" y="157" font-size="11" fill="#1E3A8A" text-anchor="middle">发现「有哪些工具可用」</text>

  <rect x="48" y="184" width="360" height="40" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="228" y="209" font-size="11" fill="#1E3A8A" text-anchor="middle">统一「怎么调一个外部服务器的工具」</text>

  <rect x="48" y="236" width="360" height="40" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="228" y="261" font-size="11" fill="#1E3A8A" text-anchor="middle">工具 Schema 自动暴露给模型</text>

  <text x="48" y="308" font-size="11.5" fill="#1E40AF" font-weight="600">适合：</text>
  <text x="48" y="328" font-size="11" fill="#475569">· 接多个第三方 SaaS（日历、邮件、知识库）</text>
  <text x="48" y="348" font-size="11" fill="#475569">· 只读、低风险、工具数量多且变动频繁</text>
  <text x="48" y="368" font-size="11" fill="#475569">· 不需要在写操作前暂停等人</text>

  <!-- Not MCP side -->
  <rect x="452" y="88" width="400" height="300" rx="10" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="472" y="116" font-size="13" font-weight="600" fill="#7C2D12">MCP 不解决的</text>

  <rect x="472" y="132" width="360" height="40" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="652" y="157" font-size="11" fill="#7C2D12" text-anchor="middle">「哪个 Agent 能调哪个工具」</text>

  <rect x="472" y="184" width="360" height="40" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="652" y="209" font-size="11" fill="#7C2D12" text-anchor="middle">「写操作前必须等用户确认」</text>

  <rect x="472" y="236" width="360" height="40" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="652" y="261" font-size="11" fill="#7C2D12" text-anchor="middle">「金额怎么算、怎么复核、怎么幂等」</text>

  <text x="472" y="308" font-size="11.5" fill="#7C2D12" font-weight="600">本项目仍然需要自己做的：</text>
  <text x="472" y="328" font-size="11" fill="#9A3412">· 工具白名单（READ_ONLY_TOOLS）</text>
  <text x="472" y="348" font-size="11" fill="#9A3412">· 确认命令绑定 quote_id + 幂等键</text>
  <text x="472" y="368" font-size="11" fill="#9A3412">· Schema 校验失败的结构化回灌</text>

  <rect x="28" y="408" width="824" height="38" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="432" font-size="11.5" fill="#475569">结论：MCP 省的是「接服务器」的胶水代码；退改签的工具安全是业务设计问题，换什么协议都省不掉</text>
</svg>
