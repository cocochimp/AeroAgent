<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#0F172A">部署拓扑与依赖方向</text>
  <text x="28" y="56" font-size="12.5" fill="#64748B">服务名取自 infra/docker-compose.yml：数据层健康后 api 才起，api 健康后 worker 才起，web 只代理 api</text>

  <rect x="28" y="76" width="824" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="98" font-size="11.5" font-weight="600" fill="#475569">对外入口</text>
  <rect x="330" y="106" width="150" height="30" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="405" y="125" font-size="11" fill="#1E3A8A" text-anchor="middle">web（React/Nginx :8080）</text>
  <text x="500" y="125" font-size="10.5" fill="#94A3B8">depends_on: api；无独立 healthcheck</text>

  <rect x="28" y="158" width="824" height="118" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="180" font-size="11.5" font-weight="600" fill="#475569">应用进程（同一镜像，两个 command）</text>
  <rect x="150" y="196" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="260" y="216" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">api</text>
  <text x="260" y="234" font-size="10" fill="#475569" text-anchor="middle">uvicorn backend.app.api.main:app :8000</text>
  <rect x="490" y="196" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="600" y="216" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">worker</text>
  <text x="600" y="234" font-size="10" fill="#475569" text-anchor="middle">python -m backend.app.worker</text>

  <rect x="28" y="290" width="824" height="118" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="312" font-size="11.5" font-weight="600" fill="#475569">数据层（并行启动，各自 healthcheck 通过后 api 才起）</text>
  <rect x="110" y="328" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="200" y="350" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">postgres:17</text>
  <text x="200" y="368" font-size="10" fill="#475569" text-anchor="middle">pg_isready；案件/报价/账本</text>
  <rect x="350" y="328" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="440" y="350" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">redis:7</text>
  <text x="440" y="368" font-size="10" fill="#475569" text-anchor="middle">appendonly yes；Streams</text>
  <rect x="590" y="328" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="680" y="350" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">qdrant:v1.13.6</text>
  <text x="680" y="368" font-size="10" fill="#475569" text-anchor="middle">:6333；规则向量检索</text>

  <rect x="28" y="422" width="824" height="70" rx="9" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="44" y="444" font-size="11.5" font-weight="600" fill="#9A3412">外部依赖（橙色，会超时，不在 compose 内）</text>
  <rect x="150" y="452" width="240" height="30" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="270" y="471" font-size="10.5" fill="#7C2D12" text-anchor="middle">航司 mock adapter（真实 GDS 未接）</text>
  <rect x="490" y="452" width="240" height="30" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="610" y="471" font-size="10.5" fill="#7C2D12" text-anchor="middle">LLM / Embedding 服务（OTEL 之外）</text>

  <text x="44" y="266" font-size="10" fill="#94A3B8">healthcheck 探针</text>
  <text x="44" y="282" font-size="10" fill="#94A3B8">（探 PG + Redis）</text>
  <path fill="none" d="M405 106 L405 86 L260 86 L260 194" stroke="#2563EB" stroke-width="1.4" marker-end="url(#t1)"/>
  <path fill="none" d="M370 222 L488 222" stroke="#2563EB" stroke-width="1.4" marker-end="url(#t1)"/>
  <path fill="none" d="M200 328 L200 252" stroke="#2563EB" stroke-width="1.3" marker-end="url(#t1)"/>
  <path fill="none" d="M440 328 L440 278 L290 278 L290 252" stroke="#2563EB" stroke-width="1.3" marker-end="url(#t1)"/>
  <path fill="none" d="M680 328 L680 286 L320 286 L320 252" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#t3)"/>
  <text x="44" y="392" font-size="10" fill="#94A3B8">虚线：api 启动时等 qdrant 健康，但运行时 /health 不探它</text>
  <path fill="none" d="M260 248 L260 414" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="3 4"/>
  <path fill="none" d="M600 248 L600 414" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="270" y="410" font-size="10" fill="#9A3412">api / worker 共同调用下方外部依赖（橙色，会超时）</text>

  <defs>
    <marker id="t1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB"/></marker>
    <marker id="t2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#EA580C"/></marker>
    <marker id="t3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
