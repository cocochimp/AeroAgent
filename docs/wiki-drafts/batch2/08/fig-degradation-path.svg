<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#0F172A">一次故障的四条降级路径</text>
  <text x="28" y="56" font-size="12.5" fill="#64748B">对照 runbook「观测与故障处理」：外部超时与中间件抖动各走哪条降级，而不是统一报 500</text>

  <rect x="28" y="74" width="824" height="100" rx="9" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="44" y="96" font-size="11.5" font-weight="600" fill="#9A3412">场景一 · 航司办理超时</text>
  <rect x="44" y="108" width="180" height="48" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="134" y="128" font-size="10.5" fill="#7C2D12" text-anchor="middle">tool_issue_ticket</text>
  <text x="134" y="145" font-size="10" fill="#7C2D12" text-anchor="middle">返回「处理中/未知」</text>
  <path fill="none" d="M224 132 L260 132" stroke="#EA580C" stroke-width="1.4" marker-end="url(#d2)"/>
  <rect x="262" y="108" width="240" height="48" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="382" y="128" font-size="10.5" fill="#1E3A8A" text-anchor="middle">按幂等键查单 / 对账</text>
  <text x="382" y="145" font-size="10" fill="#1E3A8A" text-anchor="middle">operation 标记「结果待核实」</text>
  <path fill="none" d="M502 132 L538 132" stroke="#2563EB" stroke-width="1.4" marker-end="url(#d1)"/>
  <rect x="540" y="108" width="292" height="48" rx="7" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="686" y="128" font-size="10.5" fill="#475569" text-anchor="middle">不盲目重放；用户侧提示「办理中」</text>
  <text x="686" y="145" font-size="10" fill="#475569" text-anchor="middle">当前 mock 不代表真实航司/GDS</text>

  <rect x="28" y="184" width="824" height="100" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="206" font-size="11.5" font-weight="600" fill="#475569">场景二 · Redis 临时不可用</text>
  <rect x="44" y="218" width="180" height="48" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="134" y="238" font-size="10.5" fill="#1E3A8A" text-anchor="middle">事件发布失败</text>
  <text x="134" y="255" font-size="10" fill="#1E3A8A" text-anchor="middle">SSE 实时流断开</text>
  <path fill="none" d="M224 242 L260 242" stroke="#2563EB" stroke-width="1.4" marker-end="url(#d1)"/>
  <rect x="262" y="218" width="240" height="48" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="382" y="238" font-size="10.5" fill="#1E3A8A" text-anchor="middle">关键案件事件仍写 PostgreSQL</text>
  <text x="382" y="255" font-size="10" fill="#1E3A8A" text-anchor="middle">Outbox 留未发布行</text>
  <path fill="none" d="M502 242 L538 242" stroke="#2563EB" stroke-width="1.4" marker-end="url(#d1)"/>
  <rect x="540" y="218" width="292" height="48" rx="7" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="686" y="238" font-size="10.5" fill="#475569" text-anchor="middle">Redis 恢复后 dispatcher 重投</text>
  <text x="686" y="255" font-size="10" fill="#475569" text-anchor="middle">Redis 不做账本，事件丢了可补</text>

  <rect x="28" y="294" width="824" height="100" rx="9" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="44" y="316" font-size="11.5" font-weight="600" fill="#9A3412">场景三 · Qdrant 或检索模型不可用</text>
  <rect x="44" y="328" width="180" height="48" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="134" y="348" font-size="10.5" fill="#7C2D12" text-anchor="middle">向量检索抛错</text>
  <text x="134" y="365" font-size="10" fill="#7C2D12" text-anchor="middle">召回为空</text>
  <path fill="none" d="M224 352 L260 352" stroke="#EA580C" stroke-width="1.4" marker-end="url(#d2)"/>
  <rect x="262" y="328" width="240" height="48" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="382" y="348" font-size="10.5" fill="#1E3A8A" text-anchor="middle">兼容检索层走既有降级路径</text>
  <text x="382" y="365" font-size="10" fill="#1E3A8A" text-anchor="middle">结构化条件先过滤</text>
  <path fill="none" d="M502 352 L538 352" stroke="#2563EB" stroke-width="1.4" marker-end="url(#d1)"/>
  <rect x="540" y="328" width="292" height="48" rx="7" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="686" y="348" font-size="10.5" fill="#475569" text-anchor="middle">最终费用由规则与运价引擎判定</text>
  <text x="686" y="365" font-size="10" fill="#475569" text-anchor="middle">检索只找依据，不决定金额</text>

  <rect x="28" y="404" width="824" height="100" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="426" font-size="11.5" font-weight="600" fill="#475569">场景四 · 队列积压或 worker 崩溃</text>
  <rect x="44" y="438" width="180" height="48" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="134" y="458" font-size="10.5" fill="#1E3A8A" text-anchor="middle">pending 消息堆积</text>
  <text x="134" y="475" font-size="10" fill="#1E3A8A" text-anchor="middle">消费者宕机</text>
  <path fill="none" d="M224 462 L260 462" stroke="#2563EB" stroke-width="1.4" marker-end="url(#d1)"/>
  <rect x="262" y="438" width="240" height="48" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="382" y="458" font-size="10.5" fill="#1E3A8A" text-anchor="middle">xautoclaim 60 秒后接管 pending</text>
  <text x="382" y="475" font-size="10" fill="#1E3A8A" text-anchor="middle">重试 3 次仍失败进死信</text>
  <path fill="none" d="M502 462 L538 462" stroke="#2563EB" stroke-width="1.4" marker-end="url(#d1)"/>
  <rect x="540" y="438" width="292" height="48" rx="7" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="686" y="458" font-size="10.5" fill="#475569" text-anchor="middle">死信 air-ticket:tasks:dead 人工核 operation</text>
  <text x="686" y="475" font-size="10" fill="#475569" text-anchor="middle">不丢消息、不无限重试、不直接删</text>

  <defs>
    <marker id="d1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB"/></marker>
    <marker id="d2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#EA580C"/></marker>
  </defs>
</svg>
