<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#FFFFFF"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#0F172A">四个关键指标与告警阈值</text>
  <text x="28" y="56" font-size="12.5" fill="#64748B">分子分母与初始阈值；这是教学项目的起评线，不是对客 SLA</text>

  <rect x="28" y="76" width="404" height="170" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="100" font-size="12" font-weight="600" fill="#1E3A8A">工具成功率</text>
  <text x="44" y="124" font-size="10.5" fill="#475569">分子：tool_* 调用成功次数</text>
  <text x="44" y="142" font-size="10.5" fill="#475569">分母：tool_* 调用总次数</text>
  <text x="44" y="166" font-size="10.5" fill="#475569">正常 ≥ 95%；告警 &lt; 90%</text>
  <text x="44" y="190" font-size="10.5" fill="#9A3412">依据：写工具失败必须当场告警，只读工具</text>
  <text x="44" y="206" font-size="10.5" fill="#9A3412">失败多为外部/检索抖动，允许更高容忍</text>
  <text x="44" y="230" font-size="10" fill="#94A3B8">处置：按工具名拆面板，写工具失败先停流量</text>

  <rect x="448" y="76" width="404" height="170" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="464" y="100" font-size="12" font-weight="600" fill="#1E3A8A">检索命中率</text>
  <text x="464" y="124" font-size="10.5" fill="#475569">分子：取证轮返回有效规则并被 rule_refs 引用</text>
  <text x="464" y="142" font-size="10.5" fill="#475569">分母：取证轮总数</text>
  <text x="464" y="166" font-size="10.5" fill="#475569">正常 ≥ 80%；告警 &lt; 60%</text>
  <text x="464" y="190" font-size="10.5" fill="#9A3412">依据：命中率低说明规则库覆盖或 embedding</text>
  <text x="464" y="206" font-size="10.5" fill="#9A3412">退化；但金额仍由引擎兜底，不直接出错</text>
  <text x="464" y="230" font-size="10" fill="#94A3B8">处置：查规则版本与 Qdrant collection，不调金额</text>

  <rect x="28" y="262" width="404" height="170" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="286" font-size="12" font-weight="600" fill="#1E3A8A">金额校验失败率</text>
  <text x="44" y="310" font-size="10.5" fill="#475569">分子：verify 打回或 1% 复核超阈值需重新报价</text>
  <text x="44" y="328" font-size="10.5" fill="#475569">分母：报价生成总次数</text>
  <text x="44" y="352" font-size="10.5" fill="#475569">正常 ≤ 5%；告警 &gt; 10%</text>
  <text x="44" y="376" font-size="10.5" fill="#9A3412">依据：偶发波动正常；超过说明规则版本与</text>
  <text x="44" y="392" font-size="10.5" fill="#9A3412">报价一致性有问题，会逼用户反复确认</text>
  <text x="44" y="416" font-size="10" fill="#94A3B8">处置：查最近规则版本变更，回滚或修引擎</text>

  <rect x="448" y="262" width="404" height="170" rx="9" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="464" y="286" font-size="12" font-weight="600" fill="#9A3412">办理超时率</text>
  <text x="464" y="310" font-size="10.5" fill="#475569">分子：办理超时或返回「结果待核实」次数</text>
  <text x="464" y="328" font-size="10.5" fill="#475569">分母：提交办理总次数</text>
  <text x="464" y="352" font-size="10.5" fill="#475569">正常 ≤ 2%；告警 &gt; 5%</text>
  <text x="464" y="376" font-size="10.5" fill="#9A3412">依据：对应航司 SLA；超时最危险的动作是</text>
  <text x="464" y="392" font-size="10.5" fill="#9A3412">重放，所以阈值一到先查单而不是扩容</text>
  <text x="464" y="416" font-size="10" fill="#94A3B8">处置：按幂等键查航司单，超 N 笔转人工</text>

  <rect x="28" y="442" width="824" height="22" fill="#F8FAFC"/>
  <text x="44" y="458" font-size="10.5" fill="#64748B">四个指标都必须能从 span 名（agent.* / pricing.* / servicing.*）直接聚合；挂不上 case_id 的面板等于没有。</text>
</svg>
