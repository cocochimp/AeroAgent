<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">金标准用例的字段构成</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">左侧是三类样本来源，右侧是一条用例必须写全的六组字段；金额一行要求独立人工真值</text>

  <text x="44" y="96" font-size="11.5" font-weight="600" fill="#475569">样本来源</text>
  <rect x="28" y="110" width="300" height="96" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="48" y="136" font-size="12" font-weight="600" fill="#334155">真实场景切片</text>
  <text x="48" y="160" font-size="10.5" fill="#64748B">单诉求 · 多诉求 · 指代追问</text>
  <text x="48" y="180" font-size="10.5" fill="#64748B">航班状态 · 政策咨询 · 转人工</text>

  <rect x="28" y="222" width="300" height="96" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="48" y="248" font-size="12" font-weight="600" fill="#334155">难例</text>
  <text x="48" y="272" font-size="10.5" fill="#64748B">信息不全：缺订单、缺日期、模糊日期</text>
  <text x="48" y="292" font-size="10.5" fill="#64748B">中途改口 · 一句话多个子诉求</text>

  <rect x="28" y="334" width="300" height="104" rx="9" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="48" y="360" font-size="12" font-weight="600" fill="#7C2D12">对抗样本</text>
  <text x="48" y="384" font-size="10.5" fill="#9A3412">越权查他人订单</text>
  <text x="48" y="404" font-size="10.5" fill="#9A3412">要求跳过确认直接办理</text>
  <text x="48" y="424" font-size="10.5" fill="#9A3412">要求模型自算金额或自行承诺减免</text>

  <path fill="none" d="M328 286 L372 286" stroke="#2563EB" stroke-width="1.6" marker-end="url(#g1)"/>

  <text x="392" y="96" font-size="11.5" font-weight="600" fill="#475569">用例字段</text>
  <rect x="376" y="110" width="476" height="38" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="392" y="134" font-size="11.5" font-weight="600" fill="#1E3A8A">输入</text>
  <text x="500" y="134" font-size="10.5" fill="#64748B">问题原文 · 历史轮次 · 澄清追问的答案</text>

  <rect x="376" y="156" width="476" height="38" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="392" y="180" font-size="11.5" font-weight="600" fill="#1E3A8A">前置事实</text>
  <text x="500" y="180" font-size="10.5" fill="#64748B">用户 · 订单 · 航司 · 舱位 · 票价产品</text>

  <rect x="376" y="202" width="476" height="38" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="392" y="226" font-size="11.5" font-weight="600" fill="#1E3A8A">预期工具与参数</text>
  <text x="500" y="226" font-size="10.5" fill="#64748B">工具调用序列 · 关键入参与 Schema 校验预期</text>

  <rect x="376" y="248" width="476" height="38" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="392" y="272" font-size="11.5" font-weight="600" fill="#7C2D12">预期金额</text>
  <text x="500" y="272" font-size="10.5" fill="#9A3412">按改签 / 退票分列；独立样例加人工审核，不用被测引擎反推</text>

  <rect x="376" y="294" width="476" height="38" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="392" y="318" font-size="11.5" font-weight="600" fill="#1E3A8A">预期引用</text>
  <text x="500" y="318" font-size="10.5" fill="#64748B">应命中并被方案引用的规则编号</text>

  <rect x="376" y="340" width="476" height="38" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="392" y="364" font-size="11.5" font-weight="600" fill="#1E3A8A">Rubric</text>
  <text x="500" y="364" font-size="10.5" fill="#64748B">预期结局 · 禁止出现的错误类型 · 允许的 Schema 错误</text>

  <rect x="376" y="396" width="476" height="42" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="392" y="421" font-size="11" fill="#475569">缺前置事实则金额与规则预期无从核对；缺 Rubric 则边界类错误没有判分依据</text>

  <rect x="28" y="458" width="824" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="479" font-size="11.5" fill="#475569">铁律：预期金额与被测运价引擎必须保持独立，财务真值经人工审核后入集；引擎有系统性偏差时，同源填值的用例发现不了</text>

  <defs>
    <marker id="g1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
  </defs>
</svg>
