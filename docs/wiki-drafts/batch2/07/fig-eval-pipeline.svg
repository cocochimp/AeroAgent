<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">评测链路：离线回归与线上抽样</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">左侧是当前能跑通的离线路径；右侧线上抽样回流为规划环节，代码尚未实现</text>

  <rect x="28" y="84" width="380" height="292" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="48" y="110" font-size="12.5" font-weight="600" fill="#1E40AF">离线回归 · 已落地部分实现</text>

  <rect x="64" y="126" width="308" height="46" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="218" y="154" font-size="12" fill="#1E3A8A" text-anchor="middle">夹具用例集（65 条，build 生成）</text>
  <rect x="64" y="188" width="308" height="46" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="218" y="216" font-size="12" fill="#1E3A8A" text-anchor="middle">校验器：ID、用户订单、工具规则、金额一致性</text>
  <rect x="64" y="250" width="308" height="46" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="218" y="278" font-size="12" fill="#1E3A8A" text-anchor="middle">CLI / worker 异步运行（子进程）</text>
  <rect x="64" y="312" width="308" height="46" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="218" y="340" font-size="12" fill="#1E3A8A" text-anchor="middle">逐步比对 → 报告：指标、原因码、分组通过率</text>

  <path fill="none" d="M218 172 L218 186" stroke="#2563EB" stroke-width="1.6" marker-end="url(#p1)"/>
  <path fill="none" d="M218 234 L218 248" stroke="#2563EB" stroke-width="1.6" marker-end="url(#p1)"/>
  <path fill="none" d="M218 296 L218 310" stroke="#2563EB" stroke-width="1.6" marker-end="url(#p1)"/>

  <rect x="472" y="84" width="380" height="292" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <text x="492" y="110" font-size="12.5" font-weight="600" fill="#64748B">线上抽样回流 · 未完成</text>

  <rect x="508" y="126" width="308" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="662" y="154" font-size="12" fill="#475569" text-anchor="middle">线上会话抽样（无采集通道）</text>
  <rect x="508" y="188" width="308" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="662" y="216" font-size="12" fill="#475569" text-anchor="middle">脱敏处理与归因标注</text>
  <rect x="508" y="250" width="308" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="662" y="278" font-size="12" fill="#475569" text-anchor="middle">加入回归集，与修复前基线比较</text>
  <text x="508" y="336" font-size="10.5" fill="#94A3B8">设计文档规划：失败案例脱敏后回流，避免重复踩坑</text>

  <path fill="none" d="M508 149 L486 149" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#p3)"/>
  <path fill="none" d="M662 172 L662 186" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#p3)"/>
  <path fill="none" d="M662 234 L662 248" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#p3)"/>

  <rect x="28" y="396" width="824" height="96" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="48" y="422" font-size="12.5" font-weight="600" fill="#7C2D12">放量门槛 · 任一未达标不许放量</text>
  <rect x="48" y="438" width="240" height="40" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="168" y="463" font-size="11.5" fill="#7C2D12" text-anchor="middle">金额准确率：fee_mismatch 为零</text>
  <rect x="320" y="438" width="240" height="40" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="440" y="463" font-size="11.5" fill="#7C2D12" text-anchor="middle">确认安全率：无确认不办理，越权全拦截</text>
  <rect x="592" y="438" width="240" height="40" rx="7" fill="#FFFFFF" stroke="#EA580C"/>
  <text x="712" y="463" font-size="11.5" fill="#7C2D12" text-anchor="middle">办理成功率：分层统计，回执对账闭环</text>

  <defs>
    <marker id="p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
