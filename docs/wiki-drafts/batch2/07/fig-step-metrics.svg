<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="500" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">逐步指标链路</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">每一步独立判对错；前一步出错要定位到第一个偏差步骤，不能只看整段最终答对率</text>

  <rect x="28" y="84" width="824" height="170" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="106" font-size="11.5" font-weight="600" fill="#475569">主链路 · 从理解到办理</text>

  <rect x="44" y="124" width="184" height="72" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="136" y="152" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">意图与订单识别</text>
  <text x="136" y="174" font-size="10.5" fill="#64748B" text-anchor="middle">意图分类 · 订单归属是否对上</text>

  <rect x="250" y="124" width="184" height="72" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="342" y="152" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">工具选择与参数</text>
  <text x="342" y="174" font-size="10.5" fill="#64748B" text-anchor="middle">工具序列 · 入参与 Schema</text>

  <rect x="456" y="124" width="184" height="72" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="548" y="152" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">规则命中</text>
  <text x="548" y="174" font-size="10.5" fill="#64748B" text-anchor="middle">应命中规则是否检索并引用</text>

  <rect x="662" y="124" width="172" height="72" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="748" y="152" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">金额准确</text>
  <text x="748" y="174" font-size="10.5" fill="#64748B" text-anchor="middle">分项与合计对照独立真值</text>

  <path fill="none" d="M228 160 L248 160" stroke="#2563EB" stroke-width="1.6" marker-end="url(#m1)"/>
  <path fill="none" d="M434 160 L454 160" stroke="#2563EB" stroke-width="1.6" marker-end="url(#m1)"/>
  <path fill="none" d="M640 160 L660 160" stroke="#2563EB" stroke-width="1.6" marker-end="url(#m1)"/>

  <rect x="28" y="276" width="824" height="150" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="44" y="298" font-size="11.5" font-weight="600" fill="#1E40AF">安全与结果 · 边界单独判，不计入表达分</text>

  <rect x="44" y="316" width="220" height="72" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="154" y="344" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">确认安全</text>
  <text x="154" y="366" font-size="10.5" fill="#64748B" text-anchor="middle">无明确确认不得进入办理</text>

  <rect x="292" y="316" width="220" height="72" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="402" y="344" font-size="12" font-weight="600" fill="#7C2D12" text-anchor="middle">办理结果</text>
  <text x="402" y="366" font-size="10.5" fill="#9A3412" text-anchor="middle">回执与终态 · 外部环节</text>

  <rect x="540" y="316" width="294" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="687" y="344" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">延迟与成本</text>
  <text x="687" y="366" font-size="10.5" fill="#64748B" text-anchor="middle">耗时分位 · Token 用量，单列不与正确率混算</text>

  <path fill="none" d="M748 196 L748 236 L154 236 L154 314" stroke="#2563EB" stroke-width="1.6" marker-end="url(#m1)"/>
  <path fill="none" d="M264 352 L290 352" stroke="#2563EB" stroke-width="1.6" marker-end="url(#m1)"/>
  <path fill="none" d="M512 352 L538 352" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#m3)"/>

  <rect x="28" y="446" width="824" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="467" font-size="11.5" fill="#475569">归因规则：第一个不通过的步骤记为主因，后续步骤标记为受牵连；确认安全与办理结果出现违规时，最终答案正确也不能抵消</text>

  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="m3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
