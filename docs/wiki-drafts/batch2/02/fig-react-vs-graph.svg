<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">自由 ReAct 与显式状态图</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">同一段退改诉求，差别在「谁决定下一步」和「谁决定能不能往下走」</text>

  <rect x="28" y="82" width="380" height="418" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="48" y="110" font-size="12.5" font-weight="600" fill="#475569">自由 ReAct · 模型决定下一步</text>

  <rect x="114" y="132" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="224" y="159" font-size="12" fill="#334155" text-anchor="middle">思考：下一步做什么</text>
  <rect x="114" y="196" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="224" y="223" font-size="12" fill="#334155" text-anchor="middle">选一个工具、凑一组参数</text>
  <rect x="114" y="260" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="224" y="287" font-size="12" fill="#334155" text-anchor="middle">看结果，再决定下一步</text>
  <rect x="114" y="324" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <text x="224" y="347" font-size="12" fill="#334155" text-anchor="middle">答复，或直接写库</text>
  <text x="224" y="365" font-size="10.5" fill="#64748B" text-anchor="middle">写不写、算不算，都是一次模型判断</text>

  <path d="M110 340 C66 300 66 176 104 160" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <text x="52" y="250" font-size="10.5" fill="#94A3B8" text-anchor="middle" transform="rotate(-90 52 250)">循环次数不可预知</text>

  <text x="48" y="412" font-size="11.5" fill="#64748B">· 循环轮次不可预知，只能靠超时和步数上限兜底</text>
  <text x="48" y="434" font-size="11.5" fill="#64748B">· 写操作前的暂停只能写进提示词，无法强制</text>
  <text x="48" y="456" font-size="11.5" fill="#64748B">· 状态、权限都藏在上下文里，trace 里看不到边界</text>
  <text x="48" y="478" font-size="11.5" fill="#64748B">· 复现失败只能重放整段对话，无法从某一步重来</text>

  <rect x="472" y="82" width="380" height="418" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="492" y="110" font-size="12.5" font-weight="600" fill="#1E40AF">显式状态图 · 代码决定能不能往下走</text>

  <rect x="492" y="130" width="152" height="42" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="568" y="156" font-size="12" fill="#1E3A8A" text-anchor="middle">理解 + 参数校验</text>
  <rect x="492" y="184" width="152" height="42" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="568" y="210" font-size="12" fill="#1E3A8A" text-anchor="middle">只读取证</text>
  <rect x="492" y="238" width="152" height="42" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="568" y="264" font-size="12" fill="#1E3A8A" text-anchor="middle">核价 + 报价快照</text>
  <rect x="492" y="292" width="152" height="42" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="568" y="318" font-size="12" fill="#7C2D12" text-anchor="middle">航司办理（外部）</text>
  <rect x="492" y="346" width="152" height="42" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="568" y="372" font-size="12" fill="#1E3A8A" text-anchor="middle">收尾 + 写账本</text>

  <path d="M568 172 L568 182" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M568 226 L568 236" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M568 280 L568 290" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M568 334 L568 344" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a2)"/>

  <rect x="664" y="130" width="176" height="42" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="676" y="149" font-size="10.5" fill="#64748B">schema 不过就打回</text>
  <text x="676" y="164" font-size="10.5" fill="#64748B">未知工具名也算失败</text>
  <path d="M644 151 L662 151" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#a3)"/>

  <rect x="664" y="184" width="176" height="42" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="676" y="203" font-size="10.5" fill="#64748B">缺订单或日期就中断</text>
  <text x="676" y="218" font-size="10.5" fill="#64748B">恢复从同一节点继续</text>
  <path d="M644 205 L662 205" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#a3)"/>

  <rect x="664" y="238" width="176" height="42" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="676" y="257" font-size="10.5" fill="#64748B">证据不足不进报价</text>
  <text x="676" y="272" font-size="10.5" fill="#64748B">直接进人工复核</text>
  <path d="M644 259 L662 259" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#a3)"/>

  <rect x="664" y="292" width="176" height="42" rx="7" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="676" y="311" font-size="10.5" fill="#9A3412">没有 confirm 进不来</text>
  <text x="676" y="326" font-size="10.5" fill="#9A3412">超时先查单，不重放</text>
  <path d="M644 313 L662 313" stroke="#EA580C" stroke-width="1.3" marker-end="url(#a4)"/>

  <rect x="664" y="346" width="176" height="42" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="676" y="365" font-size="10.5" fill="#64748B">回执与账本一起写</text>
  <text x="676" y="380" font-size="10.5" fill="#64748B">对不上就进对账队列</text>
  <path d="M644 367 L662 367" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#a3)"/>

  <text x="492" y="412" font-size="11.5" fill="#1E40AF">· 一个方框就是一个节点，节点名同时是 trace 名</text>
  <text x="492" y="434" font-size="11.5" fill="#1E40AF">· 两个中断点：澄清与确认，都在写操作之前</text>
  <text x="492" y="456" font-size="11.5" fill="#1E40AF">· 橙色只出现在外部依赖，一眼看出哪里会超时</text>
  <text x="492" y="478" font-size="11.5" fill="#1E40AF">· 分支是条件边，不是模型记忆里的「我记得」</text>

  <rect x="28" y="514" width="824" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="535" font-size="11.5" fill="#475569">差别不在拓扑，而在出口：自由 ReAct 的每个出口都由模型决定；状态图把「写库」和「调航司」各自锁在一个必经节点后面</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#EA580C"/></marker>
  </defs>
</svg>
