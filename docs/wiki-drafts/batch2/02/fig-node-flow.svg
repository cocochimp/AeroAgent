<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#0F172A">一次退改的四段流程</text>
  <text x="28" y="56" font-size="12.5" fill="#64748B">节点名取自 air_agent/graph.py 的真实装配顺序；虚线框是会停下来等人的中断点</text>

  <rect x="28" y="72" width="824" height="104" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="94" font-size="11.5" font-weight="600" fill="#475569">第一段 · 理解与绑定</text>
  <rect x="150" y="112" width="124" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="212" y="133" font-size="11" fill="#1E3A8A" text-anchor="middle">user_input</text>
  <rect x="298" y="112" width="124" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="360" y="133" font-size="11" fill="#1E3A8A" text-anchor="middle">memory_node</text>
  <rect x="446" y="112" width="124" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="508" y="133" font-size="11" fill="#1E3A8A" text-anchor="middle">order_align</text>
  <rect x="594" y="112" width="124" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="656" y="133" font-size="11" fill="#1E3A8A" text-anchor="middle">query_understand</text>
  <rect x="752" y="112" width="88" height="34" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <text x="796" y="133" font-size="10.5" fill="#475569" text-anchor="middle">clarify 中断</text>
  <path fill="none" d="M274 129 L294 129" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M422 129 L442 129" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M570 129 L590 129" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M718 129 L748 129" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f3)"/>
  <text x="44" y="158" font-size="10.5" fill="#94A3B8">缺订单或缺日期就走右上的中断，补齐后回到同一节点重跑</text>

  <rect x="28" y="186" width="824" height="104" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="208" font-size="11.5" font-weight="600" fill="#475569">第二段 · 只读取证</text>
  <rect x="150" y="226" width="108" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="204" y="247" font-size="11" fill="#1E3A8A" text-anchor="middle">agent_node</text>
  <rect x="276" y="226" width="116" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="334" y="247" font-size="11" fill="#1E3A8A" text-anchor="middle">schema_validate</text>
  <rect x="410" y="226" width="116" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="468" y="247" font-size="11" fill="#1E3A8A" text-anchor="middle">checkpoint_gate</text>
  <rect x="544" y="226" width="104" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="596" y="247" font-size="11" fill="#1E3A8A" text-anchor="middle">tool_exec</text>
  <rect x="666" y="226" width="100" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="716" y="247" font-size="11" fill="#1E3A8A" text-anchor="middle">sub_done</text>
  <path fill="none" d="M258 243 L272 243" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M392 243 L406 243" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M526 243 L540 243" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M648 243 L662 243" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <text x="44" y="272" font-size="10.5" fill="#94A3B8">校验不过、门禁缺失、子诉求没问完，都在这一段内部打回，不产生任何外部调用</text>

  <rect x="28" y="300" width="824" height="104" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="322" font-size="11.5" font-weight="600" fill="#475569">第三段 · 核价与校验</text>
  <text x="170" y="322" font-size="10.5" fill="#94A3B8">金额只在这里生成一次，之后所有环节读的都是快照</text>
  <rect x="150" y="340" width="124" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="212" y="361" font-size="11" fill="#1E3A8A" text-anchor="middle">tool_scheme_gen</text>
  <rect x="298" y="340" width="124" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="360" y="361" font-size="11" fill="#1E3A8A" text-anchor="middle">verify_node</text>
  <rect x="446" y="340" width="124" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="508" y="361" font-size="11" fill="#1E3A8A" text-anchor="middle">retry_node</text>
  <rect x="594" y="340" width="124" height="34" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="656" y="361" font-size="11" fill="#1E3A8A" text-anchor="middle">finish</text>
  <path fill="none" d="M274 357 L294 357" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M570 357 L590 357" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M508 374 L508 386 L212 386 L212 378" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f3)"/>
  <text x="522" y="392" font-size="10.5" fill="#94A3B8">校验不通过带反馈重写</text>
  

  <rect x="28" y="414" width="824" height="84" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="436" font-size="11.5" font-weight="600" fill="#475569">第四段 · 确认与办理</text>
  <rect x="150" y="446" width="132" height="34" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="4 3"/>
  <text x="216" y="467" font-size="10.5" fill="#475569" text-anchor="middle">await_confirm 中断</text>
  <rect x="330" y="446" width="150" height="34" rx="7" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="405" y="467" font-size="10.5" fill="#7C2D12" text-anchor="middle">tool_issue_ticket</text>
  <ellipse cx="546" cy="463" rx="42" ry="19" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="546" y="467" font-size="11" fill="#475569" text-anchor="middle">END</text>
  <path fill="none" d="M282 463 L326 463" stroke="#2563EB" stroke-width="1.4" marker-end="url(#f1)"/>
  <path fill="none" d="M480 463 L500 463" stroke="#EA580C" stroke-width="1.4" marker-end="url(#f2)"/>
  <text x="600" y="452" font-size="10.5" fill="#9A3412">没有确认就进不了这一步</text>
  <text x="600" y="468" font-size="10.5" fill="#9A3412">超时先查单，不盲目重放</text>

  <path fill="none" d="M718 182 L718 186 L204 186 L204 190" stroke="#CBD5E1" stroke-width="1.3" marker-end="url(#f3)"/>
  <path fill="none" d="M766 294 L766 300 L204 300 L204 304" stroke="#CBD5E1" stroke-width="1.3" marker-end="url(#f3)"/>
  <path fill="none" d="M718 408 L718 412 L216 412 L216 416" stroke="#CBD5E1" stroke-width="1.3" marker-end="url(#f3)"/>

  <defs>
    <marker id="f1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB"/></marker>
    <marker id="f2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#EA580C"/></marker>
    <marker id="f3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
