<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">三 Agent 权限矩阵</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">权限不是提示词里的约定，而是「有没有这个工具、能不能通过这个门」的结构问题</text>

  <text x="28" y="96" font-size="11.5" font-weight="600" fill="#475569">角色</text>
  <text x="298" y="96" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">读订单与票证</text>
  <text x="394" y="96" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">查票规与航变</text>
  <text x="490" y="96" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">计算金额</text>
  <text x="586" y="96" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">生成报价</text>
  <text x="682" y="96" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">改案件状态</text>
  <text x="778" y="96" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">调航司办理</text>

  <rect x="28" y="110" width="824" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="28" y="178" width="824" height="64" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="28" y="246" width="824" height="64" rx="8" fill="#FFF7ED" stroke="#FED7AA"/>
  <rect x="28" y="314" width="824" height="64" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>

  <text x="44" y="139" font-size="12.5" font-weight="600" fill="#334155">主 Agent · 对话与调度</text>
  <text x="44" y="158" font-size="10.5" fill="#64748B">can_call 恒为 False，只负责发起中断</text>
  <text x="44" y="207" font-size="12.5" font-weight="600" fill="#334155">方案 Agent · 只读取证</text>
  <text x="44" y="226" font-size="10.5" fill="#64748B">白名单四个名字，多一个都调不到</text>
  <text x="44" y="275" font-size="12.5" font-weight="600" fill="#7C2D12">交易 Agent · 确认后执行</text>
  <text x="44" y="294" font-size="10.5" fill="#9A3412">只接受绑定报价的确认命令</text>
  <text x="44" y="343" font-size="12.5" font-weight="600" fill="#1E40AF">确定性业务服务</text>
  <text x="44" y="362" font-size="10.5" fill="#1E40AF">资格与金额的唯一裁定者</text>

  <path d="M293 139 L299 145 L308 133" stroke="#2563EB" stroke-width="2" fill="none"/>
  <line x1="386" y1="142" x2="402" y2="142" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="482" y1="142" x2="498" y2="142" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="578" y1="142" x2="594" y2="142" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="674" y1="142" x2="690" y2="142" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="770" y1="142" x2="786" y2="142" stroke="#CBD5E1" stroke-width="1.6"/>

  <path d="M293 207 L299 213 L308 201" stroke="#2563EB" stroke-width="2" fill="none"/>
  <path d="M389 207 L395 213 L404 201" stroke="#2563EB" stroke-width="2" fill="none"/>
  <line x1="482" y1="210" x2="498" y2="210" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="578" y1="210" x2="594" y2="210" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="674" y1="210" x2="690" y2="210" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="770" y1="210" x2="786" y2="210" stroke="#CBD5E1" stroke-width="1.6"/>

  <path d="M293 275 L299 281 L308 269" stroke="#2563EB" stroke-width="2" fill="none"/>
  <line x1="386" y1="278" x2="402" y2="278" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="482" y1="278" x2="498" y2="278" stroke="#CBD5E1" stroke-width="1.6"/>
  <line x1="578" y1="278" x2="594" y2="278" stroke="#CBD5E1" stroke-width="1.6"/>
  <path d="M677 275 L683 281 L692 269" stroke="#EA580C" stroke-width="2" fill="none"/>
  <path d="M773 275 L779 281 L788 269" stroke="#EA580C" stroke-width="2" fill="none"/>

  <path d="M293 343 L299 349 L308 337" stroke="#2563EB" stroke-width="2" fill="none"/>
  <path d="M389 343 L395 349 L404 337" stroke="#2563EB" stroke-width="2" fill="none"/>
  <path d="M485 343 L491 349 L500 337" stroke="#2563EB" stroke-width="2" fill="none"/>
  <path d="M581 343 L587 349 L596 337" stroke="#2563EB" stroke-width="2" fill="none"/>
  <path d="M682 343 L688 349 L697 337" stroke="#2563EB" stroke-width="2" fill="none"/>
  <line x1="770" y1="346" x2="786" y2="346" stroke="#CBD5E1" stroke-width="1.6"/>

  <text x="302" y="163" font-size="10" fill="#2563EB">仅本人</text>
  <text x="302" y="301" font-size="10" fill="#EA580C">仅绑定单</text>
  <text x="690" y="301" font-size="10" fill="#EA580C">幂等</text>
  <text x="690" y="369" font-size="10" fill="#64748B">由交易触发</text>

  <text x="44" y="402" font-size="10.5" fill="#64748B">✓ 有权限　— 无权限；橙色表示需要幂等保护的外部件</text>
  <rect x="28" y="414" width="824" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="435" font-size="11.5" fill="#475569">写权限只有两个出口：改案件状态只经交易 Agent 的确认命令，调航司只经幂等办理；金额与资格一律由业务服务裁定</text>

  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
  </defs>
</svg>
