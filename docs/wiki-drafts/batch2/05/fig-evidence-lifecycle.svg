<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">证据过期与冲突的裁决路径</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">规则版本、航变、票证不一致三类冲突，各自在哪一步发现、回到哪里重取或重出</text>

  <rect x="28" y="86" width="268" height="344" rx="10" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="48" y="116" font-size="12.5" font-weight="600" fill="#1E3A8A">同一规则两个版本</text>
  <text x="48" y="146" font-size="11" font-weight="600" fill="#475569">现象</text>
  <text x="48" y="168" font-size="10.5" fill="#64748B">同航司同舱位命中新旧</text>
  <text x="48" y="186" font-size="10.5" fill="#64748B">两条近似条款，注入只留前三条</text>
  <text x="48" y="216" font-size="11" font-weight="600" fill="#475569">裁决</text>
  <text x="48" y="238" font-size="10.5" fill="#334155">引用 ID 必须在本次检索结果内</text>
  <text x="48" y="256" font-size="10.5" fill="#334155">引擎依据规则必须被检索到</text>
  <text x="48" y="274" font-size="10.5" fill="#334155">且写进方案 rule_refs</text>
  <text x="48" y="304" font-size="11" font-weight="600" fill="#475569">留痕</text>
  <text x="48" y="326" font-size="10.5" fill="#334155">报价记录 policy_version</text>
  <text x="48" y="344" font-size="10.5" fill="#334155">拼接本次规则引用清单</text>
  <text x="48" y="392" font-size="10.5" fill="#1E40AF">发现点：verify_node 引用校验</text>

  <rect x="306" y="86" width="268" height="344" rx="10" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="326" y="116" font-size="12.5" font-weight="600" fill="#7C2D12">航班状态变化</text>
  <text x="326" y="146" font-size="11" font-weight="600" fill="#9A3412">现象</text>
  <text x="326" y="168" font-size="10.5" fill="#9A3412">取证之后航班延误或取消</text>
  <text x="326" y="186" font-size="10.5" fill="#9A3412">旧证据不能直接支撑旧方案</text>
  <text x="326" y="216" font-size="11" font-weight="600" fill="#9A3412">裁决</text>
  <text x="326" y="238" font-size="10.5" fill="#7C2D12">办理前复核当前价格与资格</text>
  <text x="326" y="256" font-size="10.5" fill="#7C2D12">超 1% 或退款金额减少</text>
  <text x="326" y="274" font-size="10.5" fill="#7C2D12">生成新报价，等待再次确认</text>
  <text x="326" y="304" font-size="11" font-weight="600" fill="#9A3412">留痕</text>
  <text x="326" y="326" font-size="10.5" fill="#7C2D12">确认价、当前价、差额承担方</text>
  <text x="326" y="344" font-size="10.5" fill="#7C2D12">写入审计记录</text>
  <text x="326" y="392" font-size="10.5" fill="#9A3412">发现点：确认后复核与办理前校验</text>

  <rect x="584" y="86" width="268" height="344" rx="10" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="604" y="116" font-size="12.5" font-weight="600" fill="#1E3A8A">票面与订单不一致</text>
  <text x="604" y="146" font-size="11" font-weight="600" fill="#475569">现象</text>
  <text x="604" y="168" font-size="10.5" fill="#64748B">文案金额、舱位或票种</text>
  <text x="604" y="186" font-size="10.5" fill="#64748B">与订单票证对不上</text>
  <text x="604" y="216" font-size="11" font-weight="600" fill="#475569">裁决</text>
  <text x="604" y="238" font-size="10.5" fill="#334155">订单事实从订单库重读</text>
  <text x="604" y="256" font-size="10.5" fill="#334155">金额只来自运价引擎工具</text>
  <text x="604" y="274" font-size="10.5" fill="#334155">逐项比对标签金额与引擎字段</text>
  <text x="604" y="304" font-size="11" font-weight="600" fill="#475569">留痕</text>
  <text x="604" y="326" font-size="10.5" fill="#334155">不符字段进 errors 清单</text>
  <text x="604" y="344" font-size="10.5" fill="#334155">回方案生成节点重出文案</text>
  <text x="604" y="392" font-size="10.5" fill="#1E40AF">发现点：verify_node 金额与论断核查</text>

  <rect x="28" y="452" width="824" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="479" font-size="11.5" fill="#475569">总原则：证据带版本与时间；旧证据不覆盖新事实；冲突时以数据库记录与办理前复核结果为准，上下文里的文本不充当真值</text>
</svg>
