<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">上下文分层栈与 token 预算</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">每一层谁写入、能不能压、压完之后靠什么追溯，是 Context 工程的三张清单</text>

  <rect x="28" y="82" width="500" height="418" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="48" y="108" font-size="12.5" font-weight="600" fill="#475569">分层：从不可变约束到可压缩记忆</text>

  <rect x="48" y="122" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="64" y="144" font-size="12" font-weight="600" fill="#1E3A8A">系统提示 system</text>
  <text x="64" y="163" font-size="10.5" fill="#64748B">代码写入：只能依据规则与引擎金额作答，不得编造</text>
  <text x="430" y="152" font-size="11" fill="#1E3A8A" text-anchor="middle">永不截断</text>

  <rect x="48" y="182" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="64" y="204" font-size="12" font-weight="600" fill="#1E3A8A">任务层 parsed 与 clarified</text>
  <text x="64" y="223" font-size="10.5" fill="#64748B">query_understand 拆解子诉求；clarify 回填订单、日期、意图</text>
  <text x="430" y="212" font-size="11" fill="#1E3A8A" text-anchor="middle">结构化不压</text>

  <rect x="48" y="242" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="64" y="264" font-size="12" font-weight="600" fill="#1E3A8A">订单栈 order_stack 与当前订单</text>
  <text x="64" y="283" font-size="10.5" fill="#64748B">finish 节点把订单压入栈顶；指代消解按栈顺序回指</text>
  <text x="430" y="272" font-size="11" fill="#1E3A8A" text-anchor="middle">永不截断</text>

  <rect x="48" y="302" width="460" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="64" y="324" font-size="12" font-weight="600" fill="#7C2D12">证据栈 rules / 航变 / 票证金额</text>
  <text x="64" y="343" font-size="10.5" fill="#9A3412">tool_exec 写入 calls，sub_done 沉淀 results；外部时效数据</text>
  <text x="430" y="332" font-size="11" fill="#7C2D12" text-anchor="middle">可裁条数 不改数值</text>

  <rect x="48" y="362" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="64" y="384" font-size="12" font-weight="600" fill="#334155">会话历史 history</text>
  <text x="64" y="403" font-size="10.5" fill="#64748B">近几轮原文在窗内，旧轮次归档并压成摘要</text>
  <text x="430" y="392" font-size="11" fill="#64748B" text-anchor="middle">可压缩</text>

  <rect x="48" y="422" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="64" y="444" font-size="12" font-weight="600" fill="#334155">用户画像 profile</text>
  <text x="64" y="463" font-size="10.5" fill="#64748B">航线、航司、票种、退改偏好的统计计数，只作加权与默认值</text>
  <text x="430" y="452" font-size="11" fill="#64748B" text-anchor="middle">可压缩</text>

  <rect x="548" y="82" width="304" height="418" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="568" y="108" font-size="12.5" font-weight="600" fill="#1E40AF">默认预算 3000 tokens 的份额</text>

  <text x="568" y="138" font-size="11" fill="#334155">系统提示</text>
  <rect x="660" y="128" width="21" height="14" rx="4" fill="#2563EB"/>
  <text x="808" y="139" font-size="10.5" fill="#475569">15%</text>

  <text x="568" y="172" font-size="11" fill="#334155">任务字段</text>
  <text x="660" y="172" font-size="10.5" fill="#64748B">不占文本预算，走结构化状态</text>

  <text x="568" y="206" font-size="11" fill="#334155">当前订单</text>
  <rect x="660" y="196" width="21" height="14" rx="4" fill="#2563EB"/>
  <text x="808" y="207" font-size="10.5" fill="#475569">15%</text>

  <text x="568" y="240" font-size="11" fill="#7C2D12">检索规则</text>
  <rect x="660" y="230" width="56" height="14" rx="4" fill="#EA580C"/>
  <text x="808" y="241" font-size="10.5" fill="#475569">40%</text>

  <text x="568" y="274" font-size="11" fill="#334155">会话历史</text>
  <rect x="660" y="264" width="28" height="14" rx="4" fill="#93C5FD"/>
  <text x="808" y="275" font-size="10.5" fill="#475569">20%</text>

  <text x="568" y="308" font-size="11" fill="#334155">用户画像</text>
  <rect x="660" y="298" width="14" height="14" rx="4" fill="#93C5FD"/>
  <text x="808" y="309" font-size="10.5" fill="#475569">10%</text>

  <line x1="568" y1="336" x2="832" y2="336" stroke="#CBD5E1"/>
  <text x="568" y="360" font-size="11.5" font-weight="600" fill="#1E40AF">压缩红线</text>
  <text x="568" y="384" font-size="10.5" fill="#475569">金额数值、确认命令、规则引用 ID</text>
  <text x="568" y="402" font-size="10.5" fill="#475569">不进摘要，留在结构化状态与数据库</text>
  <text x="568" y="430" font-size="10.5" fill="#475569">高优先级先拿份额，剩余额度顺延给后层</text>
  <text x="568" y="448" font-size="10.5" fill="#475569">画像内部字段（去重键）注入前剔除</text>

  <rect x="28" y="514" width="824" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="535" font-size="11.5" fill="#475569">分层的判断标准是「记错了会怎样」：约束与事实错了就是资金事故，寒暄与偏好错了最多话术不贴合</text>
</svg>
