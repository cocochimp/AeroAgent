<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="600" fill="#0F172A">上下文组装与压缩时机</text>
  <text x="28" y="60" font-size="12.5" fill="#64748B">一轮对话里上下文装两次：理解时装记忆与订单，生成时带上全部证据重建；压缩只在收尾发生</text>

  <rect x="28" y="92" width="156" height="120" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="106" y="118" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">memory_node</text>
  <text x="106" y="140" font-size="10.5" fill="#64748B" text-anchor="middle">load_session 读记忆</text>
  <text x="106" y="158" font-size="10.5" fill="#64748B" text-anchor="middle">订单栈 / 摘要 / 轮次</text>
  <text x="106" y="176" font-size="10.5" fill="#64748B" text-anchor="middle">上次意图 / 画像加权</text>

  <path d="M184 152 L216 152" stroke="#2563EB" stroke-width="1.6" fill="none" marker-end="url(#b1)"/>

  <rect x="216" y="92" width="156" height="120" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="294" y="118" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">query_understand</text>
  <text x="294" y="140" font-size="10.5" fill="#64748B" text-anchor="middle">build_context 首装</text>
  <text x="294" y="158" font-size="10.5" fill="#64748B" text-anchor="middle">规则先传空列表</text>
  <text x="294" y="176" font-size="10.5" fill="#64748B" text-anchor="middle">产出 parsed 与 context</text>

  <path d="M372 152 L404 152" stroke="#2563EB" stroke-width="1.6" fill="none" marker-end="url(#b1)"/>

  <rect x="404" y="92" width="156" height="120" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="482" y="118" font-size="12" font-weight="600" fill="#7C2D12" text-anchor="middle">取证段 tool_exec</text>
  <text x="482" y="140" font-size="10.5" fill="#9A3412" text-anchor="middle">calls 记录当轮子诉求</text>
  <text x="482" y="158" font-size="10.5" fill="#9A3412" text-anchor="middle">sub_done 沉淀 results</text>
  <text x="482" y="176" font-size="10.5" fill="#9A3412" text-anchor="middle">规则 / 航变 / 金额</text>

  <path d="M560 152 L592 152" stroke="#2563EB" stroke-width="1.6" fill="none" marker-end="url(#b1)"/>

  <rect x="592" y="92" width="156" height="120" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="670" y="118" font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">tool_scheme_gen</text>
  <text x="670" y="140" font-size="10.5" fill="#64748B" text-anchor="middle">汇总各子诉求证据</text>
  <text x="670" y="158" font-size="10.5" fill="#64748B" text-anchor="middle">第二次 build_context</text>
  <text x="670" y="176" font-size="10.5" fill="#64748B" text-anchor="middle">带规则与报价生成方案</text>

  <path d="M670 212 L670 250 L106 250 L106 212" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#b2)"/>

  <rect x="28" y="262" width="720" height="92" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="48" y="288" font-size="12.5" font-weight="600" fill="#475569">收尾压缩：finish 节点的 add_turn 是 move，不是 copy</text>
  <text x="48" y="312" font-size="11" fill="#334155">近 4 轮原文留在 turns；超出窗口的旧轮次移入 archive 并生成摘要，摘要上限 600 字，归档上限 50 轮</text>
  <text x="48" y="334" font-size="11" fill="#334155">订单号、金额、规则引用、确认命令不经过摘要；下一轮 load_session 直接从结构化记忆与数据库重读</text>

  <rect x="764" y="262" width="88" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="808" y="296" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">重建</text>
  <text x="808" y="316" font-size="10.5" fill="#1E40AF" text-anchor="middle">下一轮</text>
  <text x="808" y="334" font-size="10.5" fill="#1E40AF" text-anchor="middle">重新组装</text>

  <rect x="28" y="386" width="824" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="48" y="410" font-size="11.5" font-weight="600" fill="#475569">预算与截断口径</text>
  <text x="48" y="432" font-size="11" fill="#475569">系统提示与当前订单永不截断；历史先保最近原文，剩余额度再放摘要末尾；画像去掉下划线内部字段后注入</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563EB"/></marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
