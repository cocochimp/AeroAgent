<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="18" font-weight="600" fill="#0F172A">三层护栏包住 Agent</text>
  <text x="24" y="56" font-size="12.5" fill="#64748B">从内到外：编排稳定性、节点断言、结构护栏；任何调用先穿过三层，才能碰到外部系统</text>

  <!-- 外层：护栏 -->
  <rect x="60" y="88" width="560" height="300" rx="10" fill="#F8FAFC" stroke="#64748B"/>
  <text x="74" y="112" font-size="12" font-weight="600" fill="#334155">护栏 · 越权拦截 / 写保护 / 降级 / 人工接管</text>

  <!-- 中层：断言 -->
  <rect x="120" y="124" width="440" height="228" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="134" y="148" font-size="12" font-weight="600" fill="#1E40AF">断言 · 入参 / 顺序 / 出口</text>

  <!-- 内层：编排稳定性 -->
  <rect x="180" y="160" width="320" height="156" rx="10" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="194" y="184" font-size="12" font-weight="600" fill="#1E3A8A">编排稳定性 · 循环上限 / 超时 / 重试预算</text>

  <!-- 内层 chips -->
  <rect x="194" y="196" width="88" height="26" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="238" y="213" font-size="11" fill="#1E3A8A" text-anchor="middle">循环上限</text>
  <rect x="292" y="196" width="88" height="26" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="336" y="213" font-size="11" fill="#1E3A8A" text-anchor="middle">超时</text>
  <rect x="390" y="196" width="92" height="26" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="436" y="213" font-size="11" fill="#1E3A8A" text-anchor="middle">重试预算</text>

  <!-- Agent 核心 -->
  <rect x="250" y="236" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="262" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">Agent 决策与工具调用</text>
  <text x="340" y="282" font-size="10.5" fill="#64748B" text-anchor="middle">状态图节点 / 工具循环</text>

  <!-- 中层 chips -->
  <rect x="134" y="304" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="194" y="321" font-size="11" fill="#1E3A8A" text-anchor="middle">入参断言</text>
  <rect x="264" y="304" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="324" y="321" font-size="11" fill="#1E3A8A" text-anchor="middle">顺序断言</text>
  <rect x="394" y="304" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="454" y="321" font-size="11" fill="#1E3A8A" text-anchor="middle">出口断言</text>

  <!-- 外层 chips -->
  <rect x="74" y="348" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="134" y="365" font-size="11" fill="#334155" text-anchor="middle">工具白名单</text>
  <rect x="204" y="348" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="264" y="365" font-size="11" fill="#334155" text-anchor="middle">门禁节点</text>
  <rect x="334" y="348" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="394" y="365" font-size="11" fill="#334155" text-anchor="middle">确认命令</text>
  <rect x="464" y="348" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="524" y="365" font-size="11" fill="#334155" text-anchor="middle">降级与人工</text>

  <!-- 外部系统 -->
  <text x="660" y="100" font-size="12" font-weight="600" fill="#475569">外部系统</text>
  <rect x="660" y="116" width="176" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="748" y="147" font-size="12" fill="#7C2D12" text-anchor="middle">LLM 客户端</text>
  <rect x="660" y="184" width="176" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="748" y="215" font-size="12" fill="#7C2D12" text-anchor="middle">航司 / GDS mock</text>
  <rect x="660" y="252" width="176" height="52" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="748" y="283" font-size="12" fill="#7C2D12" text-anchor="middle">检索后端 Qdrant</text>

  <path d="M430,266 L652,210" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="540" y="240" font-size="10.5" fill="#64748B">可能超时 / 不可用</text>

  <!-- 脚注条 -->
  <rect x="60" y="416" width="776" height="44" rx="7" fill="#F8FAFC"/>
  <text x="76" y="443" font-size="11.5" fill="#475569">约束全部在系统内部可执行、可计数、可留痕；外部依赖失败走重试、对账与人工，不与内部失败混为一类。</text>
</svg>
