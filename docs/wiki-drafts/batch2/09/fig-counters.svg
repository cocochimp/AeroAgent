<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="18" font-weight="600" fill="#0F172A">五个计数器各防一类失控</text>
  <text x="24" y="56" font-size="12.5" fill="#64748B">独立计数、独立阈值、独立原因字段；共同出口是转人工，但复盘时能分清是哪一类失控</text>

  <!-- 表头 -->
  <rect x="24" y="84" width="832" height="34" rx="7" fill="#EFF6FF"/>
  <text x="40" y="106" font-size="12" font-weight="600" fill="#1E3A8A">计数器</text>
  <text x="206" y="106" font-size="12" font-weight="600" fill="#1E3A8A">所在节点</text>
  <text x="364" y="106" font-size="12" font-weight="600" fill="#1E3A8A">防什么</text>
  <text x="632" y="106" font-size="12" font-weight="600" fill="#1E3A8A">阈值与去向</text>

  <!-- 行 1 -->
  <rect x="24" y="122" width="832" height="58" fill="#FFFFFF"/>
  <text x="40" y="148" font-size="12" font-weight="600" fill="#1E3A8A">rounds</text>
  <text x="206" y="148" font-size="11" fill="#334155">agent_node</text>
  <text x="364" y="144" font-size="11" fill="#334155">决策在一个子诉求内</text>
  <text x="364" y="162" font-size="11" fill="#334155">反复横跳、不收敛</text>
  <text x="632" y="144" font-size="11" fill="#334155">max_rounds=5；超限输出</text>
  <text x="632" y="162" font-size="11" fill="#334155">human 动作，转人工</text>

  <!-- 行 2 -->
  <rect x="24" y="182" width="832" height="58" fill="#F8FAFC"/>
  <text x="40" y="208" font-size="12" font-weight="600" fill="#1E3A8A">tool_retries</text>
  <text x="206" y="208" font-size="11" fill="#334155">schema_validate</text>
  <text x="364" y="204" font-size="11" fill="#334155">工具参数反复非法、</text>
  <text x="364" y="222" font-size="11" fill="#334155">无法自动修正</text>
  <text x="632" y="204" font-size="11" fill="#334155">max_tool_retries=1；超限转人工，</text>
  <text x="632" y="222" font-size="11" fill="#334155">工具执行成功后清零</text>

  <!-- 行 3 -->
  <rect x="24" y="242" width="832" height="58" fill="#FFFFFF"/>
  <text x="40" y="268" font-size="12" font-weight="600" fill="#1E3A8A">gate_blocks</text>
  <text x="206" y="268" font-size="11" fill="#334155">checkpoint_gate</text>
  <text x="364" y="264" font-size="11" fill="#334155">跳过规则检索直接算价，</text>
  <text x="364" y="282" font-size="11" fill="#334155">反复试探必经节点</text>
  <text x="632" y="264" font-size="11" fill="#334155">阈值 2（写在 after_gate 路由）；</text>
  <text x="632" y="282" font-size="11" fill="#334155">超限转人工</text>

  <!-- 行 4 -->
  <rect x="24" y="302" width="832" height="58" fill="#F8FAFC"/>
  <text x="40" y="328" font-size="12" font-weight="600" fill="#1E3A8A">retries</text>
  <text x="206" y="328" font-size="11" fill="#334155">retry_node</text>
  <text x="364" y="324" font-size="11" fill="#334155">方案自我修正不达标、</text>
  <text x="364" y="342" font-size="11" fill="#334155">反复重生成不收敛</text>
  <text x="632" y="324" font-size="11" fill="#334155">verify.max_retries=1；</text>
  <text x="632" y="342" font-size="11" fill="#334155">超限转人工</text>

  <!-- 行 5 -->
  <rect x="24" y="362" width="832" height="58" fill="#FFFFFF"/>
  <text x="40" y="388" font-size="12" font-weight="600" fill="#1E3A8A">clarify_count</text>
  <text x="206" y="388" font-size="11" fill="#334155">clarify</text>
  <text x="364" y="384" font-size="11" fill="#334155">缺信息反复追问，</text>
  <text x="364" y="402" font-size="11" fill="#334155">仍无法确定诉求</text>
  <text x="632" y="384" font-size="11" fill="#334155">阈值 3（写在 clarify 节点）；</text>
  <text x="632" y="402" font-size="11" fill="#334155">不再追问，转人工</text>

  <!-- 分隔线 -->
  <path d="M24,180 L856,180" fill="none" stroke="#E2E8F0"/>
  <path d="M24,240 L856,240" fill="none" stroke="#E2E8F0"/>
  <path d="M24,300 L856,300" fill="none" stroke="#E2E8F0"/>
  <path d="M24,360 L856,360" fill="none" stroke="#E2E8F0"/>

  <!-- 缺口注记 -->
  <rect x="24" y="438" width="832" height="48" rx="7" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="40" y="460" font-size="11.5" fill="#7C2D12">未覆盖：同一工具同一参数连续调用的指纹比对（LoopDetector）尚未实现，当前只由 rounds 上限兜底；</text>
  <text x="40" y="478" font-size="11.5" fill="#7C2D12">计数器记录的是「次数」，不是「重复」，两者不能互相替代。</text>
</svg>
