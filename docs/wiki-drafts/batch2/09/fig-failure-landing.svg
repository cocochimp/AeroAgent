<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="18" font-weight="600" fill="#0F172A">失败状态的合法落点</text>
  <text x="24" y="56" font-size="12.5" fill="#64748B">未证实的结果只能落在待核实或待人工；COMPLETED 是终态，失败路径禁止回写</text>

  <text x="40" y="96" font-size="12" font-weight="600" fill="#475569">失败来源</text>

  <!-- 左侧失败来源 -->
  <rect x="40" y="110" width="190" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="135" y="139" font-size="11.5" fill="#7C2D12" text-anchor="middle">模型 / 引擎报错</text>
  <rect x="40" y="166" width="190" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="135" y="195" font-size="11.5" fill="#7C2D12" text-anchor="middle">外部超时未回执</text>
  <rect x="40" y="222" width="190" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="135" y="251" font-size="11.5" fill="#7C2D12" text-anchor="middle">复核超出已确认方案</text>
  <rect x="40" y="278" width="190" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="135" y="307" font-size="11.5" fill="#7C2D12" text-anchor="middle">出口断言未通过</text>

  <!-- 中间办理段 -->
  <rect x="330" y="196" width="170" height="84" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="415" y="228" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">办理段</text>
  <text x="415" y="250" font-size="12" fill="#1E3A8A" text-anchor="middle">PROCESSING</text>

  <!-- 左到中连线 -->
  <path d="M230,134 L322,216" fill="none" stroke="#64748B" stroke-width="1.1" marker-end="url(#arrow3)"/>
  <path d="M230,190 L322,228" fill="none" stroke="#64748B" stroke-width="1.1" marker-end="url(#arrow3)"/>
  <path d="M230,246 L322,244" fill="none" stroke="#64748B" stroke-width="1.1" marker-end="url(#arrow3)"/>
  <path d="M230,302 L322,258" fill="none" stroke="#64748B" stroke-width="1.1" marker-end="url(#arrow3)"/>

  <!-- 右侧合法落点 -->
  <text x="590" y="96" font-size="12" font-weight="600" fill="#475569">合法落点</text>
  <rect x="590" y="116" width="250" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="606" y="140" font-size="12" font-weight="600" fill="#1E3A8A">RESULT_UNKNOWN</text>
  <text x="606" y="160" font-size="10.5" fill="#64748B">结果未核实，待按幂等键对账查单</text>
  <rect x="590" y="196" width="250" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="606" y="220" font-size="12" font-weight="600" fill="#1E3A8A">HUMAN_REVIEW</text>
  <text x="606" y="240" font-size="10.5" fill="#64748B">业务判断需人工介入，原因写入案件</text>
  <rect x="590" y="276" width="250" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="606" y="300" font-size="12" font-weight="600" fill="#1E3A8A">REQUOTE_REQUIRED</text>
  <text x="606" y="320" font-size="10.5" fill="#64748B">报价侧落点，案件回到待确认重新报价</text>

  <path d="M500,220 L582,145" fill="none" stroke="#64748B" stroke-width="1.1" marker-end="url(#arrow3)"/>
  <path d="M500,238 L582,225" fill="none" stroke="#64748B" stroke-width="1.1" marker-end="url(#arrow3)"/>
  <path d="M500,256 L582,305" fill="none" stroke="#64748B" stroke-width="1.1" marker-end="url(#arrow3)"/>

  <!-- 终态 -->
  <rect x="330" y="392" width="170" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="415" y="414" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">终态 COMPLETED</text>
  <text x="415" y="432" font-size="10.5" fill="#64748B" text-anchor="middle">迁移表无出边</text>

  <!-- 禁止回写 -->
  <path d="M415,280 L415,384" fill="none" stroke="#EA580C" stroke-width="1.3" stroke-dasharray="6 4"/>
  <path d="M405,326 L425,346" fill="none" stroke="#EA580C" stroke-width="1.6"/>
  <path d="M425,326 L405,346" fill="none" stroke="#EA580C" stroke-width="1.6"/>
  <text x="438" y="340" font-size="11" fill="#EA580C">禁止失败回写终态</text>

  <!-- 脚注条 -->
  <rect x="40" y="462" width="800" height="40" rx="7" fill="#F8FAFC"/>
  <text x="56" y="480" font-size="11.5" fill="#475569">迁移规则见 domain/servicing/state.py；PROCESSING 只能去 COMPLETED、RESULT_UNKNOWN、HUMAN_REVIEW。</text>
  <text x="56" y="496" font-size="11.5" fill="#475569">COMPLETED 与 CANCELLED 是终态，迁移表无出边。</text>
</svg>
