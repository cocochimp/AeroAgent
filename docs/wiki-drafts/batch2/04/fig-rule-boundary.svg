<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="520" fill="#FFFFFF"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#0F172A">票规六维定位与检索判定边界</text>
  <text x="28" y="56" font-size="12.5" fill="#64748B">一份规则先靠六个维度定位到候选；检索只负责找依据，能不能用、收多少钱由确定性服务裁定</text>

  <rect x="28" y="78" width="356" height="372" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="48" y="104" font-size="12.5" font-weight="600" fill="#475569">一份规则的六个定位维度</text>

  <rect x="48" y="120" width="156" height="46" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="60" y="139" font-size="11.5" font-weight="600" fill="#1E3A8A">航司 airline</text>
  <text x="60" y="156" font-size="10.5" fill="#64748B">二字码，通用规则记 *</text>
  <rect x="220" y="120" width="148" height="46" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="232" y="139" font-size="11.5" font-weight="600" fill="#1E3A8A">舱位 cabin</text>
  <text x="232" y="156" font-size="10.5" fill="#64748B">F / C / Y，可通配</text>

  <rect x="48" y="178" width="156" height="46" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="60" y="197" font-size="11.5" font-weight="600" fill="#1E3A8A">票种 fare_product</text>
  <text x="60" y="214" font-size="10.5" fill="#64748B">折扣/特价/团体等产品</text>
  <rect x="220" y="178" width="148" height="46" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="232" y="197" font-size="11.5" font-weight="600" fill="#1E3A8A">场景 scenario</text>
  <text x="232" y="214" font-size="10.5" fill="#64748B">自愿改/退、取消、延误等</text>

  <rect x="48" y="236" width="156" height="46" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="60" y="255" font-size="11.5" font-weight="600" fill="#1E3A8A">版本 version</text>
  <text x="60" y="272" font-size="10.5" fill="#64748B">同规则更新后递增编号</text>
  <rect x="220" y="236" width="148" height="46" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 3"/>
  <text x="232" y="255" font-size="11.5" font-weight="600" fill="#475569">生效期</text>
  <text x="232" y="272" font-size="10.5" fill="#64748B">当前仅 active 与更新时间</text>

  <text x="48" y="308" font-size="11" fill="#64748B">· 前四维是结构化过滤条件，由工具入参带入检索</text>
  <text x="48" y="328" font-size="11" fill="#64748B">· 版本由后台更新时递增，并写审计记录</text>
  <text x="48" y="348" font-size="11" fill="#64748B">· 生效起止日期尚未落成独立字段，是已知缺口</text>
  <text x="48" y="368" font-size="11" fill="#64748B">· 通配 * 表示该维度对所有取值生效</text>

  <rect x="48" y="386" width="320" height="44" rx="7" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="60" y="405" font-size="11" fill="#1E3A8A">同一张票可能命中多条规则：航司通用 + 产品专属</text>
  <text x="60" y="422" font-size="11" fill="#1E3A8A">检索把它们都作为候选带回，不在这里裁掉</text>

  <rect x="412" y="78" width="196" height="372" rx="10" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="432" y="104" font-size="12.5" font-weight="600" fill="#1E40AF">检索层 · 只找依据</text>
  <rect x="432" y="124" width="156" height="40" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="510" y="148" font-size="11" fill="#1E3A8A" text-anchor="middle">tool_rule_retrieve</text>
  <rect x="432" y="180" width="156" height="64" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="444" y="202" font-size="10.5" fill="#475569">返回候选规则：编号、</text>
  <text x="444" y="219" font-size="10.5" fill="#475569">维度字段、标题、正文、</text>
  <text x="444" y="236" font-size="10.5" fill="#475569">相关度得分与漏斗留痕</text>
  <text x="432" y="272" font-size="11" fill="#64748B">候选不等于适用</text>
  <text x="432" y="292" font-size="11" fill="#64748B">检索不输出金额</text>
  <text x="432" y="312" font-size="11" fill="#64748B">检索不判断能不能退</text>
  <rect x="432" y="332" width="156" height="72" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="444" y="354" font-size="10.5" fill="#64748B">证据不足、互相矛盾、</text>
  <text x="444" y="371" font-size="10.5" fill="#64748B">版本冲突或超出权限时，</text>
  <text x="444" y="388" font-size="10.5" fill="#64748B">停在候选状态，转人工</text>

  <rect x="636" y="78" width="216" height="372" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="656" y="104" font-size="12.5" font-weight="600" fill="#1E40AF">确定性服务 · 才判适用</text>
  <rect x="656" y="124" width="176" height="40" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="744" y="148" font-size="11" fill="#1E3A8A" text-anchor="middle">运价/规则引擎 calc</text>
  <rect x="656" y="180" width="176" height="64" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="668" y="202" font-size="10.5" fill="#1E3A8A">输出：是否允许、依据规则号</text>
  <text x="668" y="219" font-size="10.5" fill="#1E3A8A">费率、改签费/差价/退票额</text>
  <text x="668" y="236" font-size="10.5" fill="#1E3A8A">金额只从这里产生一次</text>
  <rect x="656" y="260" width="176" height="52" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="668" y="281" font-size="10.5" fill="#1E3A8A">后置核查：金额逐项比对</text>
  <text x="668" y="298" font-size="10.5" fill="#1E3A8A">引用必须在本次候选内</text>
  <text x="656" y="336" font-size="11" fill="#1E40AF">资格与金额的唯一裁定者</text>
  <text x="656" y="356" font-size="11" fill="#1E40AF">模型和检索都不能改写它</text>

  <path fill="none" d="M384 264 L408 264" stroke="#2563EB" stroke-width="1.6" marker-end="url(#b1)"/>
  <path fill="none" d="M608 264 L632 264" stroke="#2563EB" stroke-width="1.6" marker-end="url(#b1)"/>

  <rect x="28" y="466" width="824" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="487" font-size="11.5" fill="#475569">边界一句话：检索回答「有哪些规则可能相关」，确定性服务回答「这张票到底能不能办、办多少」；两者之间不允许模型替服务下结论</text>

  <defs>
    <marker id="b1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB"/></marker>
  </defs>
</svg>
