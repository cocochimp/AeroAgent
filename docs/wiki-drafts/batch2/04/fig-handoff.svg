<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#FFFFFF"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#0F172A">检索之后：候选如何走到报价或转人工</text>
  <text x="28" y="56" font-size="12.5" fill="#64748B">命中规则只是候选；资格与金额由确定性服务算，后置核查不过就带反馈重写一次，仍不过才转人工</text>

  <rect x="48" y="86" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="148" y="112" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">检索候选规则</text>
  <text x="148" y="131" font-size="10.5" fill="#64748B" text-anchor="middle">编号、维度、正文、得分</text>

  <rect x="300" y="86" width="220" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="410" y="112" font-size="11.5" font-weight="600" fill="#1E40AF" text-anchor="middle">确定性引擎 calc</text>
  <text x="410" y="131" font-size="10.5" fill="#1E40AF" text-anchor="middle">是否允许、依据规则号、金额</text>

  <rect x="580" y="86" width="220" height="66" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="690" y="112" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">后置核查 verify</text>
  <text x="690" y="131" font-size="10.5" fill="#64748B" text-anchor="middle">金额逐项比对、引用合法性</text>

  <path fill="none" d="M248 119 L296 119" stroke="#2563EB" stroke-width="1.6" marker-end="url(#h1)"/>
  <path fill="none" d="M520 119 L576 119" stroke="#2563EB" stroke-width="1.6" marker-end="url(#h1)"/>

  <rect x="120" y="186" width="260" height="54" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="250" y="208" font-size="11.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">核查通过</text>
  <text x="250" y="226" font-size="10.5" fill="#64748B" text-anchor="middle">进入报价快照，等旅客确认</text>
  <rect x="500" y="186" width="260" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 3"/>
  <text x="630" y="208" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">核查不通过</text>
  <text x="630" y="226" font-size="10.5" fill="#64748B" text-anchor="middle">带错误反馈重写，最多一次</text>
  <path fill="none" d="M690 152 L690 170 L250 170 L250 182" stroke="#2563EB" stroke-width="1.4" marker-end="url(#h1)"/>
  <path fill="none" d="M690 152 L690 182" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#h3)"/>
  <path fill="none" d="M630 186 L630 156" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#h3)"/>
  <text x="640" y="174" font-size="10" fill="#94A3B8">重写后再核查</text>

  <rect x="28" y="266" width="824" height="140" rx="10" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="48" y="292" font-size="12.5" font-weight="600" fill="#7C2D12">四类必须转人工的出口</text>

  <rect x="48" y="306" width="192" height="82" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="60" y="328" font-size="11.5" font-weight="600" fill="#9A3412">无命中</text>
  <text x="60" y="348" font-size="10.5" fill="#9A3412">非状态类诉求没有检索到</text>
  <text x="60" y="364" font-size="10.5" fill="#9A3412">依据规则，泛化改写后仍空</text>

  <rect x="256" y="306" width="192" height="82" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="268" y="328" font-size="11.5" font-weight="600" fill="#9A3412">证据矛盾</text>
  <text x="268" y="348" font-size="10.5" fill="#9A3412">金额或论断与引擎、规则对</text>
  <text x="268" y="364" font-size="10.5" fill="#9A3412">不上，引用不在本次候选内</text>

  <rect x="464" y="306" width="192" height="82" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="476" y="328" font-size="11.5" font-weight="600" fill="#9A3412">版本冲突</text>
  <text x="476" y="348" font-size="10.5" fill="#9A3412">多条规则版本互相打架，</text>
  <text x="476" y="364" font-size="10.5" fill="#9A3412">当前没有自动仲裁，交人工</text>

  <rect x="672" y="306" width="160" height="82" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="684" y="328" font-size="11.5" font-weight="600" fill="#9A3412">超出权限</text>
  <text x="684" y="348" font-size="10.5" fill="#9A3412">越权工具或越权读订单被</text>
  <text x="684" y="364" font-size="10.5" fill="#9A3412">门禁拦下，重试仍不过</text>

  <rect x="28" y="418" width="824" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="439" font-size="11.5" fill="#475569">转人工不是失败兜底，而是一条显式出口：原因写进案件记录与 trace，人工接手时能看到检索候选、引擎结果和核查报错</text>

  <defs>
    <marker id="h1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB"/></marker>
    <marker id="h3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#94A3B8"/></marker>
  </defs>
</svg>
