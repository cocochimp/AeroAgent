<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#FFFFFF"/>
  <text x="28" y="34" font-size="18" font-weight="600" fill="#0F172A">规则检索五层漏斗与每层降级去向</text>
  <text x="28" y="56" font-size="12.5" fill="#64748B">数字与阈值取自 air_agent/settings.py；每层候选数写入 funnel 留痕，可逐 stage 复盘是哪一层漏掉了规则</text>

  <rect x="28" y="76" width="540" height="86" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="98" font-size="11.5" font-weight="600" fill="#475569">① 召回 · 双路并行，先保别漏</text>
  <rect x="48" y="110" width="156" height="38" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="126" y="134" font-size="11" fill="#1E3A8A" text-anchor="middle">向量 dense Top 60</text>
  <rect x="222" y="110" width="156" height="38" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="300" y="134" font-size="11" fill="#1E3A8A" text-anchor="middle">关键词 BM25 Top 60</text>
  <rect x="396" y="110" width="152" height="38" rx="7" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="472" y="134" font-size="11" fill="#1E3A8A" text-anchor="middle">RRF 融合 Top 40</text>
  <path fill="none" d="M204 129 L218 129" stroke="#2563EB" stroke-width="1.3" marker-end="url(#f1)"/>
  <path fill="none" d="M378 129 L392 129" stroke="#2563EB" stroke-width="1.3" marker-end="url(#f1)"/>

  <rect x="28" y="174" width="540" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="196" font-size="11.5" font-weight="600" fill="#475569">② 硬过滤 · 结构化条件先裁，语义相关性再补一道门槛</text>
  <rect x="48" y="206" width="240" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="168" y="225" font-size="10.5" fill="#1E3A8A" text-anchor="middle">航司/舱位/票种匹配，通配 * 放行</text>
  <rect x="304" y="206" width="244" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="426" y="225" font-size="10.5" fill="#1E3A8A" text-anchor="middle">领域词 + 向量分过 dense_min / strict</text>

  <rect x="28" y="256" width="540" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="278" font-size="11.5" font-weight="600" fill="#475569">③ 精排 · 交叉模型打分，字段命中按权重并入</text>
  <rect x="48" y="288" width="240" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="168" y="307" font-size="10.5" fill="#1E3A8A" text-anchor="middle">FlashRank 重排（hybrid）</text>
  <rect x="304" y="288" width="244" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="426" y="307" font-size="10.5" fill="#1E3A8A" text-anchor="middle">0.7 相关度 + 0.3 字段命中分</text>

  <rect x="28" y="338" width="540" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="360" font-size="11.5" font-weight="600" fill="#475569">④ 阈值与去冗余 · 过门槛才保留，MMR 去掉近似重复</text>
  <rect x="48" y="370" width="156" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="126" y="389" font-size="10.5" fill="#1E3A8A" text-anchor="middle">rerank_min 0.6 截断</text>
  <rect x="218" y="370" width="156" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="296" y="389" font-size="10.5" fill="#1E3A8A" text-anchor="middle">画像加权只抬过门槛者</text>
  <rect x="388" y="370" width="160" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="468" y="389" font-size="10.5" fill="#1E3A8A" text-anchor="middle">MMR λ 0.7 → Top 5</text>

  <rect x="28" y="420" width="540" height="70" rx="9" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="44" y="442" font-size="11.5" font-weight="600" fill="#1E40AF">⑤ 注入与引用核查 · Top 3 进上下文，金额与论断另过确定性核查</text>
  <rect x="48" y="452" width="240" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="168" y="471" font-size="10.5" fill="#1E3A8A" text-anchor="middle">Top 3 注入生成上下文</text>
  <rect x="304" y="452" width="244" height="28" rx="7" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="426" y="471" font-size="10.5" fill="#1E3A8A" text-anchor="middle">置信度 0.85，引用须在候选内</text>

  <path fill="none" d="M298 162 L298 172" stroke="#2563EB" stroke-width="1.5" marker-end="url(#f1)"/>
  <path fill="none" d="M298 244 L298 254" stroke="#2563EB" stroke-width="1.5" marker-end="url(#f1)"/>
  <path fill="none" d="M298 326 L298 336" stroke="#2563EB" stroke-width="1.5" marker-end="url(#f1)"/>
  <path fill="none" d="M298 408 L298 418" stroke="#2563EB" stroke-width="1.5" marker-end="url(#f1)"/>

  <rect x="592" y="76" width="260" height="414" rx="10" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="612" y="102" font-size="12.5" font-weight="600" fill="#7C2D12">每层失败降到哪一层</text>

  <text x="612" y="132" font-size="11" font-weight="600" fill="#9A3412">召回降级</text>
  <text x="612" y="151" font-size="10.5" fill="#9A3412">模型加载失败或查询期报错，标记</text>
  <text x="612" y="167" font-size="10.5" fill="#9A3412">失败并失效索引，本次起走 fallback：</text>
  <text x="612" y="183" font-size="10.5" fill="#9A3412">字符 n-gram TF-IDF 余弦 + BM25</text>

  <text x="612" y="213" font-size="11" font-weight="600" fill="#9A3412">过滤降级</text>
  <text x="612" y="232" font-size="10.5" fill="#9A3412">问题里没有退改领域词，判为无关，</text>
  <text x="612" y="248" font-size="10.5" fill="#9A3412">不出候选，不做泛化改写</text>

  <text x="612" y="278" font-size="11" font-weight="600" fill="#9A3412">精排降级</text>
  <text x="612" y="297" font-size="10.5" fill="#9A3412">reranker 不可用时，用 BM25 分加</text>
  <text x="612" y="313" font-size="10.5" fill="#9A3412">5 倍向量余弦的加权分代替</text>

  <text x="612" y="343" font-size="11" font-weight="600" fill="#9A3412">召回不足</text>
  <text x="612" y="362" font-size="10.5" fill="#9A3412">命中少于 2 条时做一次 Step-back</text>
  <text x="612" y="378" font-size="10.5" fill="#9A3412">泛化或 HyDE 扩写；只做一次</text>

  <text x="612" y="408" font-size="11" font-weight="600" fill="#9A3412">终局出口</text>
  <text x="612" y="427" font-size="10.5" fill="#9A3412">仍无命中、证据矛盾或越权，停在</text>
  <text x="612" y="443" font-size="10.5" fill="#9A3412">候选状态转人工；检索降级不改变</text>
  <text x="612" y="459" font-size="10.5" fill="#9A3412">最终费用由规则与运价引擎判定</text>

  <rect x="28" y="506" width="824" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="527" font-size="11.5" fill="#475569">漏斗的顺序是「便宜的方法多召回，贵的方法精挑」：越往后候选越少、模型越贵；任何一层降级都要在返回结果里标清 backend 与 degraded 原因</text>

  <defs>
    <marker id="f1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB"/></marker>
  </defs>
</svg>
