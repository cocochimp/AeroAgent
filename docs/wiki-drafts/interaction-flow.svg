<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#0F172A">一次改签请求在交付层怎么走</text>
  <text x="24" y="52" font-size="12.5" fill="#64748B">对话负责收集，案件负责留痕，SSE 负责把中间过程推给界面，确认门禁负责把鼠标点下去的那一刻锁住</text>

  <rect x="24" y="80" width="168" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="108" y="104" font-size="12" fill="#334155" text-anchor="middle">旅客提问</text>
  <text x="108" y="122" font-size="11" fill="#94A3B8" text-anchor="middle">改签 / 退票 / 查规则</text>

  <rect x="228" y="80" width="168" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="312" y="104" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">POST /cases</text>
  <text x="312" y="122" font-size="11" fill="#1D4ED8" text-anchor="middle">建案件 + 启主 Agent</text>

  <rect x="432" y="80" width="168" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="516" y="104" font-size="12" fill="#334155" text-anchor="middle">主 Agent 理解意图</text>
  <text x="516" y="122" font-size="11" fill="#94A3B8" text-anchor="middle">补槽位 / 澄清</text>

  <rect x="636" y="80" width="168" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="720" y="104" font-size="12" fill="#334155" text-anchor="middle">方案 Agent</text>
  <text x="720" y="122" font-size="11" fill="#94A3B8" text-anchor="middle">检索规则 / 生成方案</text>

  <rect x="636" y="176" width="168" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="720" y="200" font-size="12" fill="#334155" text-anchor="middle">交易 Agent</text>
  <text x="720" y="218" font-size="11" fill="#94A3B8" text-anchor="middle">只执行已确认报价</text>

  <rect x="432" y="176" width="168" height="56" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="516" y="200" font-size="12" font-weight="600" fill="#7C2D12" text-anchor="middle">报价快照 Quote</text>
  <text x="516" y="218" font-size="11" fill="#7C2D12" text-anchor="middle">金额 / 规则 / 有效期</text>

  <rect x="228" y="176" width="168" height="56" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="312" y="200" font-size="12" font-weight="600" fill="#7C2D12" text-anchor="middle">POST /quotes/{id}/confirm</text>
  <text x="312" y="218" font-size="11" fill="#7C2D12" text-anchor="middle">确认门禁 + 幂等键</text>

  <rect x="24" y="176" width="168" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="108" y="200" font-size="12" fill="#334155" text-anchor="middle">办理台渲染</text>
  <text x="108" y="218" font-size="11" fill="#94A3B8" text-anchor="middle">卡片 / 明细 / 时间线</text>

  <rect x="24" y="292" width="780" height="58" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-dasharray="5 3"/>
  <text x="36" y="314" font-size="12" font-weight="600" fill="#334155">SSE /events：贯穿全程的旁路通道，不改变主链路，只把过程推给界面</text>
  <text x="36" y="334" font-size="11.5" fill="#475569">progress 进度 · tool_call 工具调用 · need_input 待澄清 · quote 报价就绪 · receipt 办理回执 · error 失败原因</text>

  <rect x="24" y="380" width="248" height="130" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="36" y="402" font-size="12" font-weight="600" fill="#334155">界面必须回答三个问题</text>
  <text x="36" y="424" font-size="11.5" fill="#475569">这条规则为什么适用，能不能点开原文</text>
  <text x="36" y="444" font-size="11.5" fill="#475569">这笔钱由哪几项组成，谁收谁退</text>
  <text x="36" y="464" font-size="11.5" fill="#475569">现在到哪一步，失败时卡在哪一层</text>
  <text x="36" y="488" font-size="11" fill="#94A3B8">答不全，界面就只是聊天记录的回声</text>

  <rect x="300" y="380" width="248" height="130" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="312" y="402" font-size="12" font-weight="600" fill="#334155">可回放的最小证据</text>
  <text x="312" y="424" font-size="11.5" fill="#475569">案件 ID + 事件游标（Last-Event-ID）</text>
  <text x="312" y="444" font-size="11.5" fill="#475569">报价 ID + 版本 + 有效期</text>
  <text x="312" y="464" font-size="11.5" fill="#475569">规则命中记录 + 快照版本</text>
  <text x="312" y="488" font-size="11" fill="#94A3B8">缺一项，事后就无法解释这笔钱</text>

  <rect x="576" y="380" width="228" height="130" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-dasharray="4 3"/>
  <text x="588" y="402" font-size="12" font-weight="600" fill="#7C2D12">当前状态：部分实现</text>
  <text x="588" y="424" font-size="11.5" fill="#7C2D12">15 条路由已挂载，SSE 可推</text>
  <text x="588" y="444" font-size="11.5" fill="#7C2D12">办理台三页面仅骨架</text>
  <text x="588" y="464" font-size="11.5" fill="#7C2D12">确认令牌校验未闭环</text>
  <text x="588" y="488" font-size="11" fill="#9A3412">讲的时候按「已做骨架」说</text>

  <path d="M192 108 L224 108" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a11)"/>
  <path d="M396 108 L428 108" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a11)"/>
  <path d="M600 108 L632 108" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a11)"/>
  <path d="M720 136 L720 172" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a11)"/>
  <path d="M636 204 L604 204" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a11)"/>
  <path d="M432 204 L400 204" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a11)"/>
  <path d="M228 204 L196 204" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a11)"/>
  <path d="M108 136 L108 172" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#a11)"/>
  <defs>
    <marker id="a11" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
