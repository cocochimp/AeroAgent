<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#0F172A">30 秒开场的四段结构与时间预算</text>
  <text x="24" y="52" font-size="12.5" fill="#64748B">面试官只记得住结构，记不住形容词；四段各自解决一个疑问，讲完正好半分钟</text>

  <rect x="24" y="80" width="196" height="150" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="40" y="106" font-size="12" font-weight="600" fill="#1D4ED8">① 定位 · 6 秒</text>
  <text x="40" y="132" font-size="11.5" fill="#334155">一句话说清做什么</text>
  <text x="40" y="152" font-size="11.5" fill="#334155">面向谁、解决哪类单</text>
  <text x="40" y="176" font-size="11.5" fill="#334155">机票退改签办理</text>
  <text x="40" y="196" font-size="11.5" fill="#334155">不是通用客服</text>
  <text x="40" y="220" font-size="11" fill="#64748B">解决：你到底做了什么产品</text>

  <rect x="232" y="80" width="196" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="248" y="106" font-size="12" font-weight="600" fill="#334155">② 架构 · 8 秒</text>
  <text x="248" y="132" font-size="11.5" fill="#334155">六域分层与三个 Agent</text>
  <text x="248" y="152" font-size="11.5" fill="#334155">谁理解、谁取证、谁执行</text>
  <text x="248" y="176" font-size="11.5" fill="#334155">钱与确认单独成环</text>
  <text x="248" y="220" font-size="11" fill="#64748B">解决：你是不是只会拼 prompt</text>

  <rect x="440" y="80" width="196" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="456" y="106" font-size="12" font-weight="600" fill="#334155">③ 亮点 · 10 秒</text>
  <text x="456" y="132" font-size="11.5" fill="#334155">挑一个能讲深的点</text>
  <text x="456" y="152" font-size="11.5" fill="#334155">如 1% 金额复核</text>
  <text x="456" y="176" font-size="11.5" fill="#334155">或五层检索漏斗</text>
  <text x="456" y="220" font-size="11" fill="#64748B">解决：你哪一块真的想过</text>

  <rect x="648" y="80" width="208" height="150" rx="10" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="664" y="106" font-size="12" font-weight="600" fill="#7C2D12">④ 边界 · 6 秒</text>
  <text x="664" y="132" font-size="11.5" fill="#7C2D12">主动说出未完成部分</text>
  <text x="664" y="152" font-size="11.5" fill="#7C2D12">编排迁移、权益闭环</text>
  <text x="664" y="176" font-size="11.5" fill="#7C2D12">并说清下一步补什么</text>
  <text x="664" y="220" font-size="11" fill="#9A3412">解决：你诚不诚实、有没有规划</text>

  <rect x="24" y="258" width="832" height="86" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-dasharray="5 3"/>
  <text x="38" y="282" font-size="12" font-weight="600" fill="#334155">常见翻车版本</text>
  <text x="38" y="304" font-size="11.5" fill="#475569">「我做了一个基于大模型的智能客服，用了 LangGraph、RAG、多 Agent、Redis、PostgreSQL，效果很好」</text>
  <text x="38" y="326" font-size="11.5" fill="#475569">四秒讲完技术栈，没有一句说清业务约束；面试官接不上话，只能问八股</text>

  <rect x="24" y="364" width="400" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="38" y="388" font-size="12" font-weight="600" fill="#334155">讲完主动停</text>
  <text x="38" y="410" font-size="11.5" fill="#475569">说完边界就闭嘴，等对方挑方向</text>
  <text x="38" y="430" font-size="11.5" fill="#475569">抢答三十秒以上会被打断，且失去主动权</text>

  <rect x="448" y="364" width="408" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="462" y="388" font-size="12" font-weight="600" fill="#334155">亮点只讲一个</text>
  <text x="462" y="410" font-size="11.5" fill="#475569">准备三个，视对方反应切换</text>
  <text x="462" y="430" font-size="11.5" fill="#475569">开场把三个都倒出来，等于一个都没讲</text>
</svg>
